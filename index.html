<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ember's Nocturnal Forest</title>
  <style>
    body {
      margin: 0;
      background: #03070c;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #worldBgCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .stage-interactive-element {
      position: absolute;
      z-index: 5;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    #emberWalker {
      position: absolute;
      z-index: 10;
      width: 80px;
      height: 80px;
      transform: translate(-50%, -85%);
      transition: transform 0.2s ease;
    }
    #emberWalker.is-walking {
      animation: bounceWalk 0.3s infinite alternate;
    }
    @keyframes bounceWalk {
      from { transform: translate(-50%, -85%) translateY(0); }
      to { transform: translate(-50%, -85%) translateY(-6px); }
    }
    .click-pawprint {
      position: absolute;
      z-index: 100;
      font-size: 1.2rem;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: fadeOutPaw 0.8s forwards;
    }
    @keyframes fadeOutPaw {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(1.2); }
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 12, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      perspective: 1000px;
    }
    .modal-content {
      background: #0c1b2a;
      border: 2px solid #118ab2;
      border-radius: 12px;
      padding: 2.5rem 2rem 2rem 2rem;
      width: 90%;
      max-width: 600px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .submit-sms-btn {
      background: #06d6a0;
      color: #03070c;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .submit-sms-btn:hover {
      opacity: 0.9;
    }
    .submit-sms-btn:disabled {
      background: #2b3e50;
      color: #7a8c9e;
      cursor: not-allowed;
    }
    
    /* 3D Book Page Flip Styles */
    .book-stage {
      perspective: 1200px;
      margin: 1.5rem 0;
    }
    .book-page-container {
      min-height: 150px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e0fbfc;
      padding: 1rem;
      background: rgba(7, 17, 30, 0.8);
      border-left: 4px solid #ffd166;
      border-radius: 4px;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.4s ease;
    }
    .book-page-container.flip-out-left {
      transform: rotateY(-90deg) scale(0.95);
      opacity: 0;
    }
    .book-page-container.flip-out-right {
      transform: rotateY(90deg) scale(0.95);
      opacity: 0;
    }

    .book-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
    }
    #pageIndicator {
      font-size: 0.9rem;
      color: #8d99ae;
    }
  </style>
</head>
<body>

  <!-- CANVAS BACKGROUND -->
  <canvas id="worldBgCanvas" width="1000" height="800"></canvas>

  <!-- EMBER CHARACTER -->
  <div id="emberWalker" style="left: 50%; top: 78%;">
    <svg class="ember-char" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="65" cy="74" rx="26" ry="19" fill="#7a7a7a"/>
      <circle cx="65" cy="42" r="21" fill="#7a7a7a"/>
      <g id="emberGlasses" style="opacity: 0; transition: all 0.3s ease;">
        <rect x="52" y="36" width="10" height="7" rx="2" fill="none" stroke="#ffd166" stroke-width="2"/>
        <rect x="68" y="36" width="10" height="7" rx="2" fill="none" stroke="#ffd166" stroke-width="2"/>
        <line x1="62" y1="39" x2="68" y2="39" stroke="#ffd166" stroke-width="2"/>
      </g>
    </svg>
  </div>

  <!-- INTERACTIVE HOTSPOTS -->
  <button class="stage-interactive-element" data-nav="cabin" style="left: 45%; top: 20%; width: 60px; height: 60px;" aria-label="Cabin"></button>
  <button class="stage-interactive-element" data-nav="camera" style="left: 75%; top: 45%; width: 60px; height: 60px;" aria-label="Gallery"></button>
  <button class="stage-interactive-element" data-nav="table" style="left: 45%; top: 75%; width: 60px; height: 60px;" aria-label="Book Modal"></button>
  <button class="stage-interactive-element" id="secretMushroomCluster" style="left: 15%; top: 75%; width: 40px; height: 40px;" aria-label="Mushroom Status"></button>

  <div id="statusBadge" style="position:fixed; top:20px; left:20px; z-index:50;"><span id="statusText">Ember is home</span></div>
  <div id="cameraFlashOverlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:#fff; opacity:0; pointer-events:none; transition: opacity 0.2s; z-index:2000;"></div>
  <div id="modalContainer"></div>

  <script>
    const canvas = document.getElementById('worldBgCanvas');
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#07111e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const emberWalker = document.getElementById('emberWalker');
    const statusText = document.getElementById('statusText');
    const secretMushroomCluster = document.getElementById('secretMushroomCluster');

    let currentX = 50;
    let currentY = 78;
    let isMoving = false;
    let activeModal = null;
    let isEmberLost = false;

    const landmarks = {
      cabin: { x: 50, y: 24, name: 'Meet Ember' },
      camera: { x: 76, y: 50, name: 'Gallery' },
      table: { x: 50, y: 76, name: 'Ember’s Storybook' },
      mailbox: { x: 24, y: 50, name: "If I'm Lost" }
    };

    // Precision Pawprint Click Tracker
    document.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.modal-content')) return;
      
      const paw = document.createElement('div');
      paw.className = 'click-pawprint';
      paw.innerHTML = '🐾';
      paw.style.left = `${e.clientX}px`;
      paw.style.top = `${e.clientY}px`;
      document.body.appendChild(paw);
      
      setTimeout(() => paw.remove(), 800);
    });

    function moveEmberTo(targetX, targetY, callback) {
      if (isMoving) return;
      isMoving = true;
      emberWalker.classList.add('is-walking');

      const startX = currentX;
      const startY = currentY;
      const startTime = performance.now();
      const duration = 900;

      function animateWalk(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        currentX = startX + (targetX - startX) * easeProgress;
        currentY = startY + (targetY - startY) * easeProgress;

        emberWalker.style.left = `${currentX}%`;
        emberWalker.style.top = `${currentY}%`;

        if (progress < 1) {
          requestAnimationFrame(animateWalk);
        } else {
          isMoving = false;
          emberWalker.classList.remove('is-walking');
          if (callback) callback();
        }
      }
      requestAnimationFrame(animateWalk);
    }

    document.querySelectorAll('.stage-interactive-element').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const targetKey = el.getAttribute('data-nav');
        const coords = landmarks[targetKey];
        if (!coords) return;

        closeModal();
        moveEmberTo(coords.x, coords.y, () => {
          openModal(targetKey);
        });
      });
    });

    if (secretMushroomCluster) {
      secretMushroomCluster.addEventListener('click', () => {
        isEmberLost = !isEmberLost;
        statusText.textContent = isEmberLost ? "Ember is roaming out!" : "Ember is home";
      });
    }

    function openModal(type) {
      closeModal();
      const modalOverlay = document.createElement('div');
      modalOverlay.className = 'modal-overlay';

      let innerHTML = '';

      if (type === 'table') {
        // Multi-page Storybook Modal with 3D Stage
        innerHTML = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 style="color: #ffd166; margin-top: 0;">📖 Ember's Journal</h3>
            <div class="book-stage">
              <div class="book-page-container" id="bookPageText">
                Hello, friend. My name is Ember, but the people who love me most call me Mama.
              </div>
            </div>
            <div class="book-footer">
              <button class="submit-sms-btn" id="prevPageBtn" onclick="turnBookPage(-1)" disabled>&#10094; Previous</button>
              <span id="pageIndicator">Page 1 of 6</span>
              <button class="submit-sms-btn" id="nextPageBtn" onclick="turnBookPage(1)">Next &#10095;</button>
            </div>
          </div>
        `;
      } else {
        innerHTML = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3>${landmarks[type]?.name || 'Notice'}</h3>
            <p>Welcome to this cozy corner of the forest!</p>
          </div>
        `;
      }

      modalOverlay.innerHTML = innerHTML;
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      document.body.appendChild(modalOverlay);
      activeModal = modalOverlay;
    }

    window.closeModal = function() {
      if (activeModal) {
        activeModal.remove();
        activeModal = null;
      }
    };

    // Storybook Pages Array
    const bookPages = [
      "Hello, friend. My name is Ember, but the people who love me most call me Mama.",
      "I wasn't always the fearless little explorer you see today. Once upon a time, I was just a tiny kitten with curious eyes and paws that could never stay still. Every rustling leaf, dancing butterfly, and winding trail whispered another adventure waiting to be discovered.",
      "As I grew, I became known for carrying my little traveler stick with a handkerchief tied to the end, convinced that every great explorer needed supplies for the journey ahead. Whether I was marching through moonlit forests, hopping across old stone paths, or inspecting every flower I could find, I believed the world was full of hidden treasures and friendly faces.",
      "But no matter how exciting the adventure became, there was always one place that mattered more than any forest, field, or mountain.<br><br><strong>Home.</strong>",
      "My family loves me more than all the stars in the night sky. They worry when I wander too far because, while I think I'm on the greatest expedition ever, they only see an empty spot where I should be sleeping.",
      "If you've found me, then you've become part of my story. Thank you for stopping, for caring, and for helping a little adventurer find her way back to the people waiting with open arms.<br><br>I may be brave enough to chase the horizon, but my favorite destination has always been home. Thank you for helping me get there. ❤️"
    ];

    let currentBookPage = 0;
    let isTurningPage = false;

    window.turnBookPage = function(direction) {
      if (isTurningPage) return;
      
      const newPage = currentBookPage + direction;
      if (newPage < 0 || newPage >= bookPages.length) return;

      isTurningPage = true;
      const pageElement = document.getElementById('bookPageText');
      
      // Apply 3D flip-out animation direction
      const flipClass = direction > 0 ? 'flip-out-left' : 'flip-out-right';
      pageElement.classList.add(flipClass);

      setTimeout(() => {
        currentBookPage = newPage;
        pageElement.innerHTML = bookPages[currentBookPage];
        document.getElementById('pageIndicator').textContent = `Page ${currentBookPage + 1} of ${bookPages.length}`;

        // Update button states
        document.getElementById('prevPageBtn').disabled = (currentBookPage === 0);
        document.getElementById('nextPageBtn').disabled = (currentBookPage === bookPages.length - 1);

        // Remove flip-out class to transition back smoothly (flip-in)
        pageElement.classList.remove('flip-out-left', 'flip-out-right');
        
        setTimeout(() => {
          isTurningPage = false;
        }, 200);
      }, 300);
    };
  </script>
</body>
</html>
