<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hey You Found Me - Ember</title>
  
  <style>
    /* ==========================================
        GHIBLI NIGHT FOREST THEME & RESET
        ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif, 'Segoe UI', sans-serif;
      background-color: #050b14;
      color: #f1f5f9;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
        COZY NAVIGATION BAR
        ========================================== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background: linear-gradient(180deg, rgba(5, 11, 20, 0.98) 0%, rgba(5, 11, 20, 0) 100%);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      gap: 1rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      cursor: pointer;
      position: relative;
    }

    .nav-logo-icon {
      width: 28px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-logo-icon svg {
      width: 100%;
      height: 100%;
      fill: #f3c68f;
      filter: drop-shadow(0 0 6px rgba(243, 198, 143, 0.4));
    }

    .nav-logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      color: #fffdf0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.3);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.2rem;
    }

    .nav-links a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffd166;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(6, 214, 160, 0.15);
      border: 1px solid #06d6a0;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #06d6a0;
      user-select: none;
      box-shadow: 0 0 8px rgba(6, 214, 160, 0.2);
      white-space: nowrap;
    }

    .status-badge.lost {
      background: rgba(239, 71, 111, 0.15);
      border-color: #ef476f;
      color: #ef476f;
      box-shadow: 0 0 8px rgba(239, 71, 111, 0.2);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #06d6a0;
      box-shadow: 0 0 8px #06d6a0;
      flex-shrink: 0;
    }

    .status-badge.lost .status-dot {
      background-color: #ef476f;
      box-shadow: 0 0 8px #ef476f;
    }

    /* ==========================================
        MAIN EXPANDED TREASURE MAP LAYOUT
        ========================================== */
    .main-stage-container {
      position: relative;
      width: 100%;
      max-width: 1100px;
      margin: 4.8rem auto 2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .top-intro-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0 0.5rem;
    }

    .hero-greeting {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: #f3c68f;
    }

    h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: normal;
      color: #fffdf0;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .hero-subtext {
      color: #b2bec3;
      font-size: 0.85rem;
      line-height: 1.4;
      max-width: 550px;
    }

    /* ==========================================
        TREASURE MAP CIRCULAR FOREST STAGE
        ========================================== */
    .world-panorama-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 209, 102, 0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 35px rgba(255, 209, 102, 0.15), inset 0 0 60px rgba(5, 11, 20, 0.7);
      background: #07111e;
      cursor: pointer;
    }

    .world-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.8) contrast(1.1) sepia(0.15);
      display: block;
    }

    .world-vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(3, 7, 12, 0.85);
      pointer-events: none;
      border-radius: 50%;
    }

    /* ==========================================
        VECTOR ART STAGE OBJECTS & HOTSPOTS
        ========================================== */
    .map-vector-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Clickable Landmark Hitboxes */
    .landmark-hotspot {
      position: absolute;
      z-index: 12;
      background: transparent;
      border: none;
      cursor: pointer;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }
    .landmark-hotspot:hover {
      background: rgba(255, 209, 102, 0.1);
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.3);
    }

    /* ==========================================
        GLOWING PAWPRINT EFFECT
        ========================================== */
    .click-pawprint {
      position: fixed;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none;
      z-index: 1000;
      font-size: 1.8rem;
      color: #ffd166;
      text-shadow: 0 0 10px #ffd166, 0 0 20px #06d6a0, 0 0 30px #118ab2;
      opacity: 0;
      animation: pawprintPopBelow 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pawprintPopBelow {
      0% {
        transform: translate(-50%, -30%) scale(0.3) rotate(0deg);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, 15%) scale(1.2) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, 35%) scale(1) rotate(0deg);
        opacity: 0;
      }
    }

    /* ==========================================
        MUSHROOM CLUSTER STYLES
        ========================================== */
    .mushroom-cluster {
      position: absolute;
      top: 76%;
      left: 76%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: flex-end;
      gap: 3px;
      z-index: 20;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .glowing-mushroom {
      background: transparent;
      border: none;
      padding: 0;
      pointer-events: none;
      position: relative;
      transition: transform 0.2s ease;
    }

    .mushroom-cluster:hover { transform: translate(-50%, -50%) scale(1.15); }

    .mushroom-main { width: 26px; height: 26px; }
    .mushroom-side-1 { width: 20px; height: 20px; margin-bottom: -2px; }
    .mushroom-side-2 { width: 16px; height: 16px; margin-bottom: -4px; }

    .shroom-cap {
      background-color: #e08a47;
      border-radius: 12px 12px 4px 4px;
      position: absolute;
      top: 0; left: 0; right: 0;
      margin: 0 auto;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-cap { width: 24px; height: 15px; }
    .mushroom-side-1 .shroom-cap { width: 18px; height: 12px; }
    .mushroom-side-2 .shroom-cap { width: 15px; height: 10px; }

    .shroom-stem {
      background-color: #f3c68f;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      margin: 0 auto;
      border-radius: 2px;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-stem { width: 8px; height: 13px; }
    .mushroom-side-1 .shroom-stem { width: 6px; height: 10px; }
    .mushroom-side-2 .shroom-stem { width: 5px; height: 8px; }

    .glowing-mushroom.mushroom-glowing .shroom-cap {
      background-color: #06d6a0 !important;
      box-shadow: 0 0 14px #06d6a0, 0 0 24px #118ab2;
    }

    .glowing-mushroom.mushroom-glowing .shroom-stem {
      background-color: #a9def9 !important;
      box-shadow: 0 0 10px #06d6a0;
    }

    /* ==========================================
        WALKING EMBER CHARACTER & NERD GLASSES
        ========================================== */
    .ember-wrapper {
      position: absolute;
      width: 120px;
      height: 120px;
      z-index: 18;
      pointer-events: none;
      transform: translate(-50%, -85%);
      will-change: left, top, transform, opacity;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .ember-char { width: 100%; height: 100%; overflow: visible; }

    .ember-wrapper.is-walking .ember-body-group { animation: continuousWalkAnim 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .ground-shadow { animation: shadowWalkPulse 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-back-left { animation: legMoveBack 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-back-right { animation: legMoveFront 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-front-left { animation: legMoveBack 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-front-right { animation: legMoveFront 0.22s infinite alternate ease-in-out; }

    .ember-body-group { transform-origin: 65px 75px; }
    .ground-shadow { transform-origin: 65px 102px; }
    .leg-back-left { transform-origin: 48px 78px; }
    .leg-back-right { transform-origin: 78px 78px; }
    .leg-front-left { transform-origin: 54px 80px; }
    .leg-front-right { transform-origin: 72px 80px; }
    .tail-group { transform-origin: 92px 82px; animation: tailSwishNormal 1.2s infinite ease-in-out; }

    /* Nerd Glasses Slide-Down Animation */
    .nerd-glasses-group {
      opacity: 0;
      transform: translateY(-25px) scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      transform-origin: 65px 40px;
    }

    .ember-wrapper.wearing-glasses .nerd-glasses-group {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }

    @keyframes legMoveBack {
      0% { transform: translateY(0px) rotate(-14deg); }
      100% { transform: translateY(-4px) rotate(14deg); }
    }

    @keyframes legMoveFront {
      0% { transform: translateY(-4px) rotate(14deg); }
      100% { transform: translateY(0px) rotate(-14deg); }
    }

    @keyframes continuousWalkAnim {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-5px) rotate(2deg); }
    }

    @keyframes shadowWalkPulse {
      0% { transform: scaleX(1) scaleY(1); opacity: 0.75; }
      100% { transform: scaleX(0.78) scaleY(0.5); opacity: 0.35; }
    }

    @keyframes tailSwishNormal {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }

    @keyframes lanternFlicker {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 6px #ffd166); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #ffd166); }
    }
    .string-lantern { animation: lanternFlicker 2s infinite ease-in-out; }

    .camera-flash-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      border-radius: 50%;
      transition: opacity 0.15s ease-out;
    }

    /* ==========================================
        MODAL STYLES
        ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 7, 12, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #0f1c2d;
      border: 1px solid rgba(255, 209, 102, 0.3);
      padding: 2rem;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      color: #f1f5f9;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .cabin-modal-content { max-width: 520px; text-align: center; }
    .gallery-modal-content { max-width: 540px; text-align: center; }

    .close-btn {
      position: absolute;
      top: 12px; right: 15px;
      background: none; border: none;
      color: #ffd166; font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
    }

    .modal-content h3 { color: #ffd166; font-family: 'Georgia', serif; margin-bottom: 0.5rem; }
    .modal-content p { font-size: 0.9rem; color: #b2bec3; margin-bottom: 1.2rem; line-height: 1.5; }

    /* Storybook Modal Unique Layout */
    .storybook-modal-content {
      max-width: 650px;
      background: #141b26;
      border: 2px solid #d4af37;
      padding: 2.5rem 2rem 2rem 2rem;
    }

    .storybook-page {
      display: none;
      animation: fadeInPage 0.4s ease-in-out;
    }

    .storybook-page.active-page {
      display: block;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .storybook-title {
      font-family: 'Georgia', serif;
      color: #ffd166;
      font-size: 1.4rem;
      margin-bottom: 0.8rem;
      text-align: center;
    }

    .storybook-text {
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      color: #e2e8f0;
      line-height: 1.7;
      margin-bottom: 1.5rem;
      background: rgba(5, 11, 20, 0.6);
      padding: 1.2rem;
      border-radius: 8px;
      border-left: 3px solid #ffd166;
      text-align: left;
    }

    .storybook-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      border-top: 1px solid rgba(255, 209, 102, 0.2);
      padding-top: 1rem;
    }

    .storybook-btn {
      background: #2a3a50;
      color: #ffd166;
      border: 1px solid rgba(255, 209, 102, 0.4);
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: background 0.2s;
    }

    .storybook-btn:hover:not(:disabled) {
      background: #ffd166;
      color: #050b14;
    }

    .storybook-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 0.85rem;
      color: #94a3b8;
      font-family: 'Georgia', serif;
    }

    /* Cabin Stage */
    .cabin-interior-stage {
      width: 100%;
      height: 220px;
      background: #150e08;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 209, 102, 0.2);
      margin-bottom: 1rem;
      position: relative;
    }

    @keyframes roaringFire {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.9; }
      50% { transform: scale(1.08) translateY(-3px); opacity: 1; }
    }
    @keyframes fireGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.9; }
    }

    .roaring-flame { animation: roaringFire 0.4s infinite alternate ease-in-out; transform-origin: bottom center; }
    .fireplace-glow { animation: fireGlow 0.8s infinite alternate ease-in-out; }

    @keyframes cabinEmberWander {
      0% { left: 20%; transform: scaleX(1); }
      40% { left: 60%; transform: scaleX(1); }
      45% { left: 60%; transform: scaleX(-1); }
      85% { left: 20%; transform: scaleX(-1); }
      90% { left: 20%; transform: scaleX(1); }
      100% { left: 20%; transform: scaleX(1); }
    }

    .interior-ember-character {
      position: absolute;
      bottom: 22px;
      width: 65px;
      height: 65px;
      z-index: 10;
      animation: cabinEmberWander 14s infinite linear;
    }

    .ember-lore-text {
      text-align: left;
      font-size: 0.88rem;
      color: #d1d5db;
      line-height: 1.6;
      background: rgba(5, 11, 20, 0.5);
      padding: 1rem;
      border-radius: 8px;
      border-left: 3px solid #ffd166;
    }

    /* Slideshow Styles */
    .slideshow-container {
      position: relative;
      width: 100%;
      height: 320px;
      background: #050b14;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 209, 102, 0.3);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-item {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-item.active { opacity: 1; }
    .slide-item img { width: 100%; height: 100%; object-fit: contain; }

    .slide-caption {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      background: linear-gradient(0deg, rgba(5,11,20,0.9) 0%, rgba(5,11,20,0) 100%);
      padding: 1rem 1rem 0.6rem 1rem;
      font-size: 0.85rem;
      color: #ffd166;
      font-family: 'Georgia', serif;
      font-style: italic;
    }

    .slideshow-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 28, 45, 0.7);
      border: 1px solid rgba(255, 209, 102, 0.4);
      color: #ffd166;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .slideshow-nav-btn:hover { background: rgba(255, 209, 102, 0.2); }
    .slide-prev { left: 10px; }
    .slide-next { right: 10px; }

    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; color: #ffd166; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 0.7rem;
      background: #050b14; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px; color: #fff; font-size: 0.9rem;
    }

    .submit-sms-btn {
      width: 100%; background: #d47a3d; color: #fff;
      border: none; padding: 0.8rem; border-radius: 8px;
      font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .submit-sms-btn:hover { background: #e08a47; }

    @media (max-width: 768px) {
      .navbar { padding: 0.6rem 0.8rem; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; }
      .nav-links { width: 100%; justify-content: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 0.4rem; gap: 0.8rem; }
      .nav-links a { font-size: 0.75rem; }
      .nav-right { position: absolute; top: 0.6rem; right: 0.8rem; }
      .main-stage-container { margin-top: 6.4rem; padding: 0 0.75rem; }
      .ember-wrapper { width: 85px; height: 85px; }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="#" class="nav-logo" onclick="goToLandmark('cabin'); return false;">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="5" r="1.8"/>
          <circle cx="8" cy="8" r="1.2"/>
          <circle cx="16" cy="8" r="1.2"/>
          <circle cx="6" cy="11" r="1.1"/>
          <circle cx="18" cy="11" r="1.1"/>
          <path d="M12 9.5 C9.5 9.5 8 11.5 8 13.5 C8 15.5 10 17 12 17 C14 17 16 15.5 16 13.5 C16 11.5 14.5 9.5 12 9.5 Z"/>
          <path d="M12 9.5 L12 30" stroke="#f3c68f" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M12 24 Q7 22 5 19 Q9 20 12 24 Z" fill="#f3c68f"/>
          <path d="M12 22 Q17 20 19 17 Q15 18 12 22 Z" fill="#f3c68f"/>
        </svg>
      </div>
      <div class="nav-logo-text">
        <span>Hey You</span>
        <span>Found Me</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="#" class="nav-link-item" onclick="goToLandmark('cabin'); return false;">Meet Ember</a></li>
      <li><a href="#" class="nav-link-item" onclick="goToLandmark('camera'); return false;">Gallery</a></li>
      <li><a href="#" class="nav-link-item" onclick="goToLandmark('table'); return false;">Adventures</a></li>
      <li><a href="#" class="nav-link-item" onclick="goToLandmark('mailbox'); return false;">If I'm Lost</a></li>
    </ul>
    <div class="nav-right">
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Ember is home</span>
      </div>
    </div>
  </header>

  <!-- Main Expanded Stage Container -->
  <div class="main-stage-container">
    <div class="top-intro-wrapper">
      <span class="hero-greeting">Hey... ♡</span>
      <h1>You Found Me</h1>
      <p class="hero-subtext">
        Explore the circular forest trail map. Click anywhere along the path or landmarks to guide Ember!
      </p>
    </div>

    <!-- Treasure Map Circular Forest Stage -->
    <div id="worldPanorama" class="world-panorama-container">
      <img src="https://images.unsplash.com/photo-1511497584788-8767611925b5?auto=format&fit=crop&w=1000&q=80" alt="Explore Ember's World Forest Path" class="world-bg-image" />
      <div class="world-vignette-overlay"></div>

      <!-- Vector Art Map Overlay -->
      <svg class="map-vector-overlay" viewBox="0 0 600 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="300" cy="300" r="165" fill="none" stroke="#231f20" stroke-width="48" opacity="0.45"/>
        <circle cx="300" cy="300" r="165" fill="none" stroke="#d5c3aa" stroke-width="40" stroke-dasharray="12 8" opacity="0.9"/>

        <!-- CABIN LANDMARK -->
        <g transform="translate(300, 110)">
          <ellipse cx="0" cy="42" rx="42" ry="12" fill="#03070c" opacity="0.6"/>
          <rect x="-34" y="10" width="68" height="38" rx="3" fill="#654321" stroke="#3d2812" stroke-width="1.5"/>
          <rect x="-22" y="18" width="12" height="13" rx="1" fill="#ffd166" stroke="#3d2812" stroke-width="1"/>
          <rect x="10" y="18" width="16" height="30" rx="1.5" fill="#150a04" stroke="#100804" stroke-width="1"/>
          <rect x="12" y="28" width="12" height="20" fill="#ff7043" opacity="0.4"/>
          <circle cx="18" cy="38" r="4" fill="#ffd166" opacity="0.6"/>
          <polygon points="0,-12 -44,12 44,12" fill="#2d4a3e" stroke="#1b2e26" stroke-width="1.5"/>
        </g>

        <!-- CAMERA LANDMARK -->
        <g transform="translate(456, 300)">
          <line x1="-10" y1="5" x2="-22" y2="30" stroke="#4a311c" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-10" y1="5" x2="4" y2="30" stroke="#4a311c" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="-20" y="-6" width="20" height="13" rx="2" fill="#8c7853" stroke="#3d2812" stroke-width="1.2"/>
          <circle cx="-10" cy="0" r="5.5" fill="#222" stroke="#ffd166" stroke-width="1.2"/>
        </g>

        <!-- TABLE WITH A BOOK LANDMARK -->
        <g transform="translate(300, 470)">
          <ellipse cx="0" cy="15" rx="26" ry="9" fill="#03070c" opacity="0.5"/>
          <line x1="-15" y1="8" x2="-18" y2="22" stroke="#4a311c" stroke-width="2.5"/>
          <line x1="15" y1="8" x2="18" y2="22" stroke="#4a311c" stroke-width="2.5"/>
          <ellipse cx="0" cy="8" rx="26" ry="9" fill="#654321" stroke="#3d2812" stroke-width="1.5"/>
          <path d="M -9,7 Q 0,2 9,7 Q 0,12 -9,7 Z" fill="#fffdf0" stroke="#c2b280" stroke-width="1"/>
        </g>

        <!-- MAILBOX LANDMARK -->
        <g transform="translate(144, 300)">
          <rect x="-2" y="4" width="4" height="35" fill="#5a3d28" stroke="#332114" stroke-width="1"/>
          <path d="M -12,-4 L 10,-4 A 9,9 0 0,1 19,5 L 19,10 L -12,10 Z" fill="#2d5a43" stroke="#183627" stroke-width="1.5"/>
          <rect x="17" y="-2" width="2.5" height="8" rx="1" fill="#ef476f"/>
        </g>
      </svg>

      <!-- Clickable Hotspot Buttons over Landmarks -->
      <button class="landmark-hotspot" style="top: 24%; left: 50%;" onclick="goToLandmark('cabin'); event.stopPropagation();" title="Meet Ember"></button>
      <button class="landmark-hotspot" style="top: 50%; left: 76%;" onclick="goToLandmark('camera'); event.stopPropagation();" title="Gallery"></button>
      <button class="landmark-hotspot" style="top: 76%; left: 50%;" onclick="goToLandmark('table'); event.stopPropagation();" title="Adventures"></button>
      <button class="landmark-hotspot" style="top: 50%; left: 24%;" onclick="goToLandmark('mailbox'); event.stopPropagation();" title="If I'm Lost"></button>

      <!-- Secret Mushroom Cluster Toggle -->
      <button id="secretMushroomCluster" class="mushroom-cluster" title="Toggle status" aria-label="Toggle status mushroom cluster">
        <div class="glowing-mushroom mushroom-side-2"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
        <div class="glowing-mushroom mushroom-side-1"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
        <div class="glowing-mushroom mushroom-main"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
      </button>

      <!-- Walking Ember Character Element -->
      <div id="emberWalker" class="ember-wrapper" style="left: 50%; top: 78%;">
        <svg class="ember-char" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <ellipse class="ground-shadow" cx="65" cy="102" rx="22" ry="7" fill="#03070c" opacity="0.6"/>

          <g id="emberBodyG" class="ember-body-group">
            <g class="leg-back-left">
              <path d="M48 76 Q45 92 47 98" stroke="#555" stroke-width="6" stroke-linecap="round" fill="none"/>
              <circle cx="47" cy="98" r="3.5" fill="#ffffff"/>
            </g>
            <g class="leg-back-right">
              <path d="M78 76 Q81 92 81 98" stroke="#444" stroke-width="6" stroke-linecap="round" fill="none"/>
              <circle cx="81" cy="98" r="3.5" fill="#ffffff"/>
            </g>

            <g class="tail-group">
              <path d="M88 82 Q110 75 106 50 Q104 40 110 35" stroke="#333" stroke-width="5" stroke-linecap="round" fill="none"/>
            </g>

            <ellipse cx="65" cy="74" rx="26" ry="19" fill="#7a7a7a"/>
            <path d="M 58,64 Q 65,85 72,64 Q 78,78 65,92 Q 52,78 58,64 Z" fill="#ffffff"/>

            <g class="leg-front-left">
              <path d="M54 78 Q52 93 54 99" stroke="#6a6a6a" stroke-width="6" stroke-linecap="round" fill="none"/>
              <circle cx="54" cy="99" r="3.5" fill="#ffffff"/>
            </g>
            <g class="leg-front-right">
              <path d="M72 78 Q74 93 73 99" stroke="#5c5c5c" stroke-width="6" stroke-linecap="round" fill="none"/>
              <circle cx="73" cy="99" r="3.5" fill="#ffffff"/>
            </g>

            <g id="emberLetterInMouth" style="display: none;" transform="translate(62, 45)">
              <rect x="0" y="0" width="16" height="11" rx="2" fill="#fdf6e2" stroke="#d4af37" stroke-width="1"/>
            </g>

            <g class="head-group">
              <polygon points="46,38 36,14 54,28" fill="#5a5a5a"/>
              <polygon points="84,38 94,14 76,28" fill="#5a5a5a"/>
              <circle cx="65" cy="42" r="21" fill="#7a7a7a"/>
              <path d="M 58,32 Q 65,30 72,32 Q 70,52 65,55 Q 60,52 58,32 Z" fill="#ffffff"/>

              <ellipse cx="56" cy="40" rx="4.5" ry="3" fill="#ffd166"/>
              <ellipse cx="74" cy="40" rx="4.5" ry="3" fill="#ffd166"/>
              <ellipse cx="56" cy="40" rx="1.5" ry="2.2" fill="#111"/>
              <ellipse cx="74" cy="40" rx="1.5" ry="2.2" fill="#111"/>

              <!-- Vector Art Nerd Glasses Group -->
              <g class="nerd-glasses-group">
                <line x1="42" y1="39" x2="51" y2="39" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="79" y1="39" x2="88" y2="39" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="50" y="35" width="12" height="10" rx="2" fill="none" stroke="#d4af37" stroke-width="2"/>
                <rect x="68" y="35" width="12" height="10" rx="2" fill="none" stroke="#d4af37" stroke-width="2"/>
                <path d="M 62,39 L 68,39" stroke="#d4af37" stroke-width="2"/>
                <circle cx="56" cy="40" r="1" fill="#ffd166" opacity="0.8"/>
                <circle cx="74" cy="40" r="1" fill="#ffd166" opacity="0.8"/>
              </g>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <!-- Modals Container -->
  <div id="modalContainer"></div>

  <script>
    const worldPanorama = document.getElementById('worldPanorama');
    const emberWalker = document.getElementById('emberWalker');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const modalContainer = document.getElementById('modalContainer');
    const secretMushroomCluster = document.getElementById('secretMushroomCluster');
    const emberLetterInMouth = document.getElementById('emberLetterInMouth');

    const landmarks = {
      cabin: { x: 50, y: 24 },
      camera: { x: 76, y: 50 },
      table: { x: 50, y: 76 },
      mailbox: { x: 24, y: 50 }
    };

    let isLostMode = false;
    let activeModal = null;
    let currentStoryPage = 0;

    function moveEmberTo(targetX, targetY, onComplete) {
      const startX = parseFloat(emberWalker.style.left) || 50;
      const startY = parseFloat(emberWalker.style.top) || 78;

      const dx = targetX - startX;
      const dy = targetY - startY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 1) {
        if (onComplete) onComplete();
        return;
      }

      emberWalker.style.transform = dx < 0 ? 'translate(-50%, -85%) scaleX(-1)' : 'translate(-50%, -85%) scaleX(1)';
      emberWalker.classList.add('is-walking');

      const duration = Math.min(Math.max(distance * 25, 600), 2000);
      const startTime = performance.now();

      function animateWalk(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        emberWalker.style.left = `${startX + dx * easeProgress}%`;
        emberWalker.style.top = `${startY + dy * easeProgress}%`;

        if (progress < 1) {
          requestAnimationFrame(animateWalk);
        } else {
          emberWalker.classList.remove('is-walking');
          emberWalker.style.transform = dx < 0 ? 'translate(-50%, -85%) scaleX(-1)' : 'translate(-50%, -85%) scaleX(1)';
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animateWalk);
    }

    worldPanorama.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      const rect = worldPanorama.getBoundingClientRect();
      const clickX = ((e.clientX - rect.left) / rect.width) * 100;
      const clickY = ((e.clientY - rect.top) / rect.height) * 100;

      createPawprint(e.clientX, e.clientY);
      emberWalker.classList.remove('wearing-glasses');
      moveEmberTo(clickX, clickY);
    });

    function createPawprint(clientX, clientY) {
      const paw = document.createElement('div');
      paw.className = 'click-pawprint';
      paw.innerHTML = '🐾';
      paw.style.left = `${clientX}px`;
      paw.style.top = `${clientY}px`;
      document.body.appendChild(paw);
      setTimeout(() => paw.remove(), 800);
    }

    window.goToLandmark = function(key) {
      const loc = landmarks[key];
      if (!loc) return;

      moveEmberTo(loc.x, loc.y, () => {
        if (key === 'table') {
          emberWalker.classList.add('wearing-glasses');
          setTimeout(() => {
            openModalFor(key);
          }, 500);
        } else {
          emberWalker.classList.remove('wearing-glasses');
          openModalFor(key);
        }
      });
    };

    function openModalFor(key) {
      closeModal();
      let htmlContent = '';

      if (key === 'cabin') {
        htmlContent = `
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal-content cabin-modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeModal()">&times;</button>
              <h3>Meet Ember</h3>
              <p>The cozy cabin sanctuary where the hearth is always warm.</p>
              <div class="cabin-interior-stage">
                <svg viewBox="0 0 500 220" width="100%" height="100%" preserveAspectRatio="none">
                  <rect width="500" height="220" fill="#18110b"/>
                  <rect x="0" y="170" width="500" height="50" fill="#0f0a06"/>
                  <path d="M 180,170 L 180,70 Q 210,50 250,50 Q 290,50 320,70 L 320,170 Z" fill="#2d231b"/>
                  <ellipse class="fireplace-glow" cx="250" cy="135" rx="45" ry="30" fill="#ff7043" opacity="0.6"/>
                  <g class="roaring-flame">
                    <path d="M 250,165 Q 235,130 245,110 Q 250,125 255,100 Q 265,130 250,165 Z" fill="#ffd166"/>
                  </g>
                </svg>
              </div>
              <div class="ember-lore-text">
                Ember is a gentle, spirited tabby cat with striking green-gold eyes and a white chest blaze.
              </div>
            </div>
          </div>
        `;
      } else if (key === 'camera') {
        htmlContent = `
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal-content gallery-modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeModal()">&times;</button>
              <h3>Ember's Photo Gallery</h3>
              <p>Captured moments from around the magical forest trail.</p>
              <div class="slideshow-container">
                <div class="slide-item active">
                  <img src="https://images.unsplash.com/photo-1548802673-380ab8ebc7b7?auto=format&fit=crop&w=800&q=80" alt="Ember resting">
                  <div class="slide-caption">"Finding warmth under the forest canopy."</div>
                </div>
                <div class="slide-item">
                  <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80" alt="Ember exploring">
                  <div class="slide-caption">"Chasing floating fireflies by twilight."</div>
                </div>
                <button class="slideshow-nav-btn slide-prev" onclick="changeSlide(-1)">&#10094;</button>
                <button class="slideshow-nav-btn slide-next" onclick="changeSlide(1)">&#10095;</button>
              </div>
            </div>
          </div>
        `;
      } else if (key === 'table') {
        currentStoryPage = 0;
        htmlContent = `
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal-content storybook-modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeModal()">&times;</button>
              
              <div class="storybook-page active-page" data-page="0">
                <h3 class="storybook-title">Chapter I: The Great Mushroom Trail</h3>
                <div class="storybook-text">
                  When the glowing blue mushrooms light up the forest floor, Ember leads the way down the winding stone path to uncover secret messages left behind by wandering friends.
                </div>
              </div>

              <div class="storybook-page" data-page="1">
                <h3 class="storybook-title">Chapter II: The Hearthlight Sanctuary</h3>
                <div class="storybook-text">
                  Far from the chilly night winds, the cabin door stands always welcoming. Here, curled up beside crackling embers, dreaming paws twitch in rhythm with the forest.
                </div>
              </div>

              <div class="storybook-page" data-page="2">
                <h3 class="storybook-title">Chapter III: Always Waiting For You</h3>
                <div class="storybook-text">
                  Whether wandering deep into the thicket or resting near the old mailbox, Ember knows every footstep along the trail. You found the way home. ♡
                </div>
              </div>

              <div class="storybook-nav-row">
                <button class="storybook-btn" id="prevPageBtn" onclick="changeStoryPage(-1)" disabled>&#10094; Previous</button>
                <span class="page-indicator" id="pageIndicator">Page 1 of 3</span>
                <button class="storybook-btn" id="nextPageBtn" onclick="changeStoryPage(1)">Next &#10095;</button>
              </div>
            </div>
          </div>
        `;
      } else if (key === 'mailbox') {
        htmlContent = `
          <div class="modal-overlay" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" onclick="closeModal()">&times;</button>
              <h3>If I'm Lost</h3>
              <p>Send a quick note or alert if Ember has wandered too far!</p>
              <form onsubmit="handleSmsSubmit(event)">
                <div class="form-group">
                  <label>Your Name / Finder</label>
                  <input type="text" placeholder="Friendly traveler..." required>
                </div>
                <div class="form-group">
                  <label>Message for Ember's Family</label>
                  <textarea rows="3" placeholder="Found Ember near the old cabin..." required></textarea>
                </div>
                <button type="submit" class="submit-sms-btn">Send Message 💌</button>
              </form>
            </div>
          </div>
        `;
      }

      modalContainer.innerHTML = htmlContent;
      activeModal = modalContainer.firstElementChild;
    }

    window.closeModal = function() {
      modalContainer.innerHTML = '';
      activeModal = null;
    }

    let currentSlideIndex = 0;
    window.changeSlide = function(direction) {
      const slides = document.querySelectorAll('.slide-item');
      if (!slides.length) return;
      slides[currentSlideIndex].classList.remove('active');
      currentSlideIndex = (currentSlideIndex + direction + slides.length) % slides.length;
      slides[currentSlideIndex].classList.add('active');
    }

    window.changeStoryPage = function(direction) {
      const pages = document.querySelectorAll('.storybook-page');
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');
      const indicator = document.getElementById('pageIndicator');
      
      if (!pages.length) return;

      pages[currentStoryPage].classList.remove('active-page');
      currentStoryPage += direction;

      if (currentStoryPage < 0) currentStoryPage = 0;
      if (currentStoryPage >= pages.length) currentStoryPage = pages.length - 1;

      pages[currentStoryPage].classList.add('active-page');
      indicator.textContent = `Page ${currentStoryPage + 1} of ${pages.length}`;
      prevBtn.disabled = (currentStoryPage === 0);
      nextBtn.disabled = (currentStoryPage === pages.length - 1);
    }

    window.handleSmsSubmit = function(e) {
      e.preventDefault();
      alert("Message sent successfully! Ember's family has been notified. 🐾");
      closeModal();
    }

    secretMushroomCluster.addEventListener('click', (e) => {
      e.stopPropagation();
      isLostMode = !isLostMode;

      document.querySelectorAll('.glowing-mushroom').forEach(shroom => {
        shroom.classList.toggle('mushroom-glowing', isLostMode);
      });

      if (isLostMode) {
        statusBadge.classList.add('lost');
        statusText.textContent = "Ember is lost!";
        emberLetterInMouth.style.display = 'block';
      } else {
        statusBadge.classList.remove('lost');
        statusText.textContent = "Ember is home";
        emberLetterInMouth.style.display = 'none';
      }
    });
  </script>
</body>
</html>
