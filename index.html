<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hey You Found Me - Ember</title>
  
  <style>
    /* ==========================================
        GHIBLI NIGHT FOREST THEME & RESET
        ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif, 'Segoe UI', sans-serif;
      background-color: #050b14;
      color: #f1f5f9;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
        COZY NAVIGATION BAR
        ========================================== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background: linear-gradient(180deg, rgba(5, 11, 20, 0.98) 0%, rgba(5, 11, 20, 0) 100%);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      gap: 1rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      cursor: pointer;
      position: relative;
    }

    .nav-logo-icon {
      width: 28px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-logo-icon svg {
      width: 100%;
      height: 100%;
      fill: #f3c68f;
      filter: drop-shadow(0 0 6px rgba(243, 198, 143, 0.4));
    }

    .nav-logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      color: #fffdf0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.3);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.2rem;
    }

    .nav-links a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffd166;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(6, 214, 160, 0.15);
      border: 1px solid #06d6a0;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #06d6a0;
      user-select: none;
      box-shadow: 0 0 8px rgba(6, 214, 160, 0.2);
      white-space: nowrap;
      cursor: pointer;
    }

    .status-badge.lost {
      background: rgba(239, 71, 111, 0.15);
      border-color: #ef476f;
      color: #ef476f;
      box-shadow: 0 0 8px rgba(239, 71, 111, 0.2);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #06d6a0;
      box-shadow: 0 0 8px #06d6a0;
      flex-shrink: 0;
    }

    .status-badge.lost .status-dot {
      background-color: #ef476f;
      box-shadow: 0 0 8px #ef476f;
    }

    /* ==========================================
        MAIN EXPANDED TREASURE MAP LAYOUT
        ========================================== */
    .main-stage-container {
      position: relative;
      width: 100%;
      max-width: 1100px;
      margin: 4.8rem auto 2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .top-intro-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0 0.5rem;
    }

    .hero-greeting {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: #f3c68f;
    }

    h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: normal;
      color: #fffdf0;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .hero-subtext {
      color: #b2bec3;
      font-size: 0.85rem;
      line-height: 1.4;
      max-width: 550px;
    }

    /* ==========================================
        TREASURE MAP CIRCULAR FOREST STAGE
        ========================================== */
    .world-panorama-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 209, 102, 0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 35px rgba(255, 209, 102, 0.15), inset 0 0 60px rgba(5, 11, 20, 0.7);
      background: #07111e;
      cursor: pointer;
    }

    .world-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6) contrast(1.1) sepia(0.15);
      display: block;
    }

    .world-vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(3, 7, 12, 0.85);
      pointer-events: none;
      border-radius: 50%;
    }

    .map-vector-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* ==========================================
        GLOWING SVG PAWPRINT EFFECT
        ========================================== */
    .click-pawprint {
      position: fixed;
      width: 32px;
      height: 32px;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none;
      z-index: 1000;
      opacity: 0;
      animation: pawprintPopBelow 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      filter: drop-shadow(0 0 8px #06d6a0) drop-shadow(0 0 16px #ffd166);
    }

    .click-pawprint svg {
      width: 100%;
      height: 100%;
      fill: #ffd166;
    }

    @keyframes pawprintPopBelow {
      0% { transform: translate(-50%, -30%) scale(0.3) rotate(0deg); opacity: 1; }
      50% { transform: translate(-50%, 15%) scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: translate(-50%, 35%) scale(1) rotate(0deg); opacity: 0; }
    }

    /* ==========================================
        MUSHROOM CLUSTER STYLES
        ========================================== */
    .mushroom-cluster {
      position: absolute;
      top: 76%;
      left: 76%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: flex-end;
      gap: 3px;
      z-index: 20;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .glowing-mushroom {
      background: transparent;
      border: none;
      padding: 0;
      pointer-events: none;
      position: relative;
      transition: transform 0.2s ease;
    }

    .mushroom-cluster:hover { transform: translate(-50%, -50%) scale(1.15); }

    .mushroom-main { width: 26px; height: 26px; }
    .mushroom-side-1 { width: 20px; height: 20px; margin-bottom: -2px; }
    .mushroom-side-2 { width: 16px; height: 16px; margin-bottom: -4px; }

    .shroom-cap {
      background-color: #e08a47;
      border-radius: 12px 12px 4px 4px;
      position: absolute;
      top: 0; left: 0; right: 0;
      margin: 0 auto;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-cap { width: 24px; height: 15px; }
    .mushroom-side-1 .shroom-cap { width: 18px; height: 12px; }
    .mushroom-side-2 .shroom-cap { width: 15px; height: 10px; }

    .shroom-stem {
      background-color: #f3c68f;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      margin: 0 auto;
      border-radius: 2px;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-stem { width: 8px; height: 13px; }
    .mushroom-side-1 .shroom-stem { width: 6px; height: 10px; }
    .mushroom-side-2 .shroom-stem { width: 5px; height: 8px; }

    .glowing-mushroom.mushroom-glowing .shroom-cap {
      background-color: #06d6a0 !important;
      box-shadow: 0 0 14px #06d6a0, 0 0 24px #118ab2;
    }

    .glowing-mushroom.mushroom-glowing .shroom-stem {
      background-color: #a9def9 !important;
      box-shadow: 0 0 10px #06d6a0;
    }

    /* ==========================================
        WALKING EMBER CHARACTER ANIMATIONS
        ========================================== */
    .ember-wrapper {
      position: absolute;
      width: 110px;
      height: 110px;
      z-index: 18;
      pointer-events: none;
      transform: translate(-50%, -85%);
      will-change: left, top, transform, opacity;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .ember-char { width: 100%; height: 100%; overflow: visible; }

    .ember-wrapper.is-walking .ember-body-group { animation: continuousWalkAnim 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .ground-shadow { animation: shadowWalkPulse 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-back-left { animation: legMoveBack 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-back-right { animation: legMoveFront 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-front-left { animation: legMoveBack 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-front-right { animation: legMoveFront 0.22s infinite alternate ease-in-out; }

    .ember-body-group { transform-origin: 65px 75px; }
    .ground-shadow { transform-origin: 65px 102px; }
    .leg-back-left { transform-origin: 48px 78px; }
    .leg-back-right { transform-origin: 78px 78px; }
    .leg-front-left { transform-origin: 54px 80px; }
    .leg-front-right { transform-origin: 72px 80px; }
    .tail-group { transform-origin: 92px 82px; animation: tailSwishNormal 1.2s infinite ease-in-out; }

    @keyframes legMoveBack {
      0% { transform: translateY(0px) rotate(-14deg); }
      100% { transform: translateY(-4px) rotate(14deg); }
    }

    @keyframes legMoveFront {
      0% { transform: translateY(-4px) rotate(14deg); }
      100% { transform: translateY(0px) rotate(-14deg); }
    }

    @keyframes continuousWalkAnim {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-5px) rotate(2deg); }
    }

    @keyframes shadowWalkPulse {
      0% { transform: scaleX(1) scaleY(1); opacity: 0.75; }
      100% { transform: scaleX(0.78) scaleY(0.5); opacity: 0.35; }
    }

    @keyframes tailSwishNormal {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }

    .camera-flash-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      border-radius: 50%;
      transition: opacity 0.15s ease-out;
    }

    /* ==========================================
        MODAL STYLES
        ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 7, 12, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #0f1c2d;
      border: 1px solid rgba(255, 209, 102, 0.3);
      padding: 2rem;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      color: #f1f5f9;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .close-btn {
      position: absolute;
      top: 12px; right: 15px;
      background: none; border: none;
      color: #ffd166; font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
    }

    .modal-content h3 { color: #ffd166; font-family: 'Georgia', serif; margin-bottom: 0.5rem; }
    .modal-content p { font-size: 0.9rem; color: #b2bec3; margin-bottom: 1.2rem; line-height: 1.5; }

    /* Slideshow */
    .slideshow-container {
      position: relative;
      width: 100%;
      height: 260px;
      background: #050b14;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 209, 102, 0.3);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-item {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-item.active { opacity: 1; }
    .slide-item img { width: 100%; height: 100%; object-fit: cover; }

    .form-group { margin-bottom: 1rem; text-align: left; }
    .form-group label { display: block; font-size: 0.8rem; color: #ffd166; margin-bottom: 0.3rem; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 0.7rem;
      background: #050b14; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px; color: #fff; font-size: 0.9rem;
    }

    .submit-sms-btn {
      width: 100%; background: #d47a3d; color: #fff;
      border: none; padding: 0.8rem; border-radius: 8px;
      font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .submit-sms-btn:hover { background: #e08a47; }
  </style>
</head>

  <!-- Main Expanded Treasure Map Container -->
  <div class="main-stage-container">

      <h1>You Found Me</h1>
      <p class="hero-subtext">

    <!-- Treasure Map Circular Forest Stage -->
    <div id="worldPanorama" class="world-panorama-container">
      <img src="https://images.unsplash.com/photo-1511497584788-8767611925b5?auto=format&fit=crop&w=1000&q=80" alt="Explore Ember's World Forest Path" class="world-bg-image" />

      <div id="cameraFlashOverlay" class="camera-flash-overlay"></div>

      <!-- Vector Art Circular Stone Path & Landmarks Overlay -->
      <svg class="map-vector-overlay" viewBox="0 0 600 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="300" cy="300" r="165" fill="none" stroke="#231f20" stroke-width="48" opacity="0.45"/>
        <circle cx="300" cy="300" r="165" fill="none" stroke="#d5c3aa" stroke-width="40" stroke-dasharray="12 8" opacity="0.9"/>

        </g>

        <!-- LANDMARK: CAMERA -->
        <g transform="translate(456, 300)" class="map-landmark" data-target="camera" style="cursor: pointer;">
          <rect x="-20" y="-6" width="20" height="13" rx="2" fill="#8c7853" stroke="#3d2812" stroke-width="1.2"/>
          <circle cx="-10" cy="0" r="5.5" fill="#222" stroke="#ffd166" stroke-width="1.2"/>
        </g>

        <!-- LANDMARK: TABLE -->
        <g transform="translate(300, 470)" class="map-landmark" data-target="table" style="cursor: pointer;">
          <ellipse cx="0" cy="8" rx="26" ry="9" fill="#654321" stroke="#3d2812" stroke-width="1.5"/>

        <!-- LANDMARK: MAILBOX -->

      <!-- Interactive Mushroom Cluster Toggle -->
      <button id="secretMushroomCluster" class="mushroom-cluster" title="Toggle status" aria-label="Toggle status mushroom cluster">
        <div class="glowing-mushroom mushroom-side-2"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
        <div class="glowing-mushroom mushroom-side-1"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
        <div class="glowing-mushroom mushroom-main"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>

      <!-- WALKING EMBER CHARACTER (Tabby Cat Design) -->

  </div>

  <div id="modalContainer"></div>

  <script>
    const emberWalker = document.getElementById('emberWalker');
    const worldPanorama = document.getElementById('worldPanorama');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const secretMushroomCluster = document.getElementById('secretMushroomCluster');

    let currentX = 50;
    let currentY = 15;
    let isMoving = false;
    let isLost = true;
    let activeModal = null;

    const landmarkCoords = {
      cabin: { x: 50, y: 16 },
      camera: { x: 75, y: 50 },
      table: { x: 50, y: 84 },
      mailbox: { x: 25, y: 50 }
    };

    // Glowing SVG Pawprint click effect
    document.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.modal-content') || e.target.closest('.navbar')) return;
      const paw = document.createElement('div');
      paw.className = 'click-pawprint';
      paw.style.left = `${e.clientX}px`;
      paw.style.top = `${e.clientY}px`;
      paw.innerHTML = `
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
          <path d="M256 224c-35.3 0-64 28.7-64 64s28.7 64 64 64 64-28.7 64-64-28.7-64-64-64z"/>
          <path d="M160 144c-22.1 0-40 17.9-40 40s17.9 40 40 40 40-17.9 40-40-17.9-40-40-40z"/>
          <path d="M352 144c-22.1 0-40 17.9-40 40s17.9 40 40 40 40-17.9 40-40-17.9-40-40-40z"/>
          <path d="M96 256c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32z"/>
          <path d="M416 256c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32z"/>
        </svg>
      `;
      document.body.appendChild(paw);
      setTimeout(() => paw.remove(), 800);
    });

    function moveEmberTo(targetX, targetY, callback) {
      if (isMoving) return;
      isMoving = true;
      emberWalker.classList.add('is-walking');

      const startX = currentX;
      const startY = currentY;
      const startTime = performance.now();
      const duration = 800;

      function step(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        currentX = startX + (targetX - startX) * progress;
        currentY = startY + (targetY - startY) * progress;
        emberWalker.style.left = `${currentX}%`;
        emberWalker.style.top = `${currentY}%`;

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          isMoving = false;
          emberWalker.classList.remove('is-walking');
          if (callback) callback();
        }
      }
      requestAnimationFrame(step);
    }

    // Navigation triggers
    document.querySelectorAll('[data-target]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const targetKey = item.getAttribute('data-target');
        const coords = landmarkCoords[targetKey];
        if (coords) {
          moveEmberTo(coords.x, coords.y, () => openModal(targetKey));
        }
      });
    });

    worldPanorama.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('g') || isMoving) return;
      const rect = worldPanorama.getBoundingClientRect();
      const clickX = ((e.clientX - rect.left) / rect.width) * 100;
      const clickY = ((e.clientY - rect.top) / rect.height) * 100;
      moveEmberTo(clickX, clickY);
    });

    function toggleStatusState() {
      isLost = !isLost;
      if (isLost) {
        statusBadge.className = 'status-badge lost';
        statusText.textContent = 'Ember is lost';
        secretMushroomCluster.querySelectorAll('.glowing-mushroom').forEach(m => m.classList.remove('mushroom-glowing'));
      } else {
        statusBadge.className = 'status-badge';
        statusText.textContent = 'Ember is home';
        secretMushroomCluster.querySelectorAll('.glowing-mushroom').forEach(m => m.classList.add('mushroom-glowing'));
      }
    }

    secretMushroomCluster.addEventListener('click', toggleStatusState);
    statusBadge.addEventListener('click', toggleStatusState);

    function openModal(type) {
      if (activeModal) activeModal.remove();
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      let html = '';
      if (type === 'cabin') {
        html = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3>Meet Ember</h3>
            <p>Ember is a cozy little tabby explorer who loves wandering through nocturnal forest trails.</p>
          </div>
        `;
      } else if (type === 'camera') {
        html = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3>Ember's Gallery</h3>
            <div class="slideshow-container">
              <div class="slide-item active"><img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=600&q=80" alt="Ember"></div>
            </div>
          </div>
        `;
      } else if (type === 'table') {
        html = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3>Ember's Storybook</h3>
            <p>Once upon a time in a starlit forest...</p>
          </div>
        `;
      } else {
        html = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3>If I'm Lost</h3>
            <p>Send a quick note back home to let her family know she's safe!</p>
            <div class="form-group"><label>Your Note</label><textarea rows="3" placeholder="Found Ember near..."></textarea></div>
            <button class="submit-sms-btn" onclick="closeModal()">Send Message</button>
          </div>
        `;
      }

      overlay.innerHTML = html;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
      document.body.appendChild(overlay);
      activeModal = overlay;
    }

    window.closeModal = function() {
      if (activeModal) {
        activeModal.remove();
        activeModal = null;
      }
    };
  </script>
</body>
</html>
