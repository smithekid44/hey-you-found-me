<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ember's Circular Forest Map</title>
  <style>
    body {
      margin: 0;
      background: #03070c;
      color: #fff;
      font-family: sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      position: relative;
      z-index: 50;
    }
    .logo-area {
      font-weight: bold;
      font-size: 1.1rem;
      line-height: 1.2;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      font-size: 0.95rem;
      color: #c0c0c0;
    }
    .nav-links span {
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-links span:hover {
      color: #fff;
    }
    .status-btn {
      background: #721c24;
      border: 1px solid #f5c6cb;
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .intro-text {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 2rem auto;
      font-size: 0.95rem;
      color: #9da3af;
      padding: 0 1rem;
      position: relative;
      z-index: 50;
    }
    
    /* Circular Map Stage */
    .map-container {
      position: relative;
      width: 500px;
      height: 500px;
      margin: 1rem auto 4rem auto;
    }
    .outer-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid rgba(212, 175, 55, 0.4);
      border-radius: 50%;
      pointer-events: none;
    }
    .track-ring {
      position: absolute;
      top: 50px;
      left: 50px;
      width: 400px;
      height: 400px;
      border: 45px dashed #2a241f; /* Simulates the path ties */
      border-radius: 50%;
      box-sizing: border-box;
    }
    
    /* Landmarks on Path */
    .landmark {
      position: absolute;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    #cabinLandmark { top: 75px; left: 250px; }
    #cameraLandmark { top: 250px; left: 375px; }
    #tableLandmark { top: 425px; left: 250px; }
    #mailboxLandmark { top: 250px; left: 125px; }
    #mushroomLandmark { top: 390px; left: 320px; }

    /* Ember Walker */
    #emberWalker {
      position: absolute;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -85%);
      transition: all 0.3s ease;
      z-index: 20;
    }
    #emberWalker.is-walking {
      animation: bounceWalk 0.3s infinite alternate;
    }
    @keyframes bounceWalk {
      from { transform: translate(-50%, -85%) translateY(0); }
      to { transform: translate(-50%, -85%) translateY(-5px); }
    }

    /* Pawprints */
    .click-pawprint {
      position: absolute;
      z-index: 100;
      font-size: 1.1rem;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: fadeOutPaw 0.8s forwards;
    }
    @keyframes fadeOutPaw {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(1.2); }
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 12, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      perspective: 1000px;
    }
    .modal-content {
      background: #0c1b2a;
      border: 2px solid #118ab2;
      border-radius: 12px;
      padding: 2.5rem 2rem 2rem 2rem;
      width: 90%;
      max-width: 600px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .action-btn {
      background: #06d6a0;
      color: #03070c;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    
    /* Book Styles */
    .book-stage { perspective: 1200px; margin: 1.5rem 0; }
    .book-page-container {
      min-height: 150px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e0fbfc;
      padding: 1rem;
      background: rgba(7, 17, 30, 0.8);
      border-left: 4px solid #ffd166;
      border-radius: 4px;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }
    .book-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">🌿 Hey You<br>Found Me</div>
    <div class="nav-links">
      <span onclick="navigateTo('cabin')">Meet Ember</span>
      <span onclick="navigateTo('camera')">Gallery</span>
      <span onclick="navigateTo('table')">Adventures</span>
      <span onclick="navigateTo('mailbox')">If I'm Lost</span>
    </div>
    <button class="status-btn" id="statusToggleBtn">● Ember is lost</button>
  </header>

  <div class="intro-text">
    Explore the circular forest trail map. Click anywhere along the path or a landmark to guide Ember!
  </div>

  <!-- MAP STAGE -->
  <div class="map-container" id="mapContainer">
    <div class="outer-ring"></div>
    <div class="track-ring"></div>

    <!-- LANDMARKS -->
    <div class="landmark" id="cabinLandmark" title="Cabin" onclick="navigateTo('cabin')">🏠</div>
    <div class="landmark" id="cameraLandmark" title="Gallery" onclick="navigateTo('camera')">📷</div>
    <div class="landmark" id="tableLandmark" title="Storybook" onclick="navigateTo('table')">🪵</div>
    <div class="landmark" id="mailboxLandmark" title="Mailbox" onclick="navigateTo('mailbox')">📫</div>
    <div class="landmark" id="mushroomLandmark" title="Mushrooms" onclick="toggleMushroomStatus()">🍄</div>

    <!-- EMBER CHARACTER -->
    <div id="emberWalker" style="left: 50%; top: 15%;">
      <svg viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="65" cy="74" rx="26" ry="19" fill="#7a7a7a"/>
        <circle cx="65" cy="42" r="21" fill="#7a7a7a"/>
        <!-- Ears -->
        <polygon points="48,28 55,10 65,26" fill="#7a7a7a"/>
        <polygon points="82,28 75,10 65,26" fill="#7a7a7a"/>
        <!-- Face details -->
        <circle cx="57" cy="40" r="3" fill="#ffd166"/>
        <circle cx="73" cy="40" r="3" fill="#ffd166"/>
      </svg>
    </div>
  </div>

  <div id="modalWrapper"></div>

  <script>
    const emberWalker = document.getElementById('emberWalker');
    const statusBtn = document.getElementById('statusToggleBtn');
    
    let currentX = 50; // percentage coordinates relative to map container
    let currentY = 15;
    let isMoving = false;
    let activeModal = null;
    let isLostState = true;

    const coordinates = {
      cabin: { x: 50, y: 15, name: "Meet Ember" },
      camera: { x: 75, y: 50, name: "Gallery" },
      table: { x: 50, y: 85, name: "Ember's Storybook" },
      mailbox: { x: 25, y: 50, name: "If I'm Lost" }
    };

    // Pawprint click tracker
    document.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('.landmark') || e.target.closest('.modal-content') || e.target.closest('header')) return;
      
      const paw = document.createElement('div');
      paw.className = 'click-pawprint';
      paw.innerHTML = '🐾';
      paw.style.left = `${e.clientX}px`;
      paw.style.top = `${e.clientY}px`;
      document.body.appendChild(paw);
      
      setTimeout(() => paw.remove(), 800);
    });

    function navigateTo(landmarkKey) {
      const target = coordinates[landmarkKey];
      if (!target || isMoving) return;

      isMoving = true;
      emberWalker.classList.add('is-walking');

      const startX = currentX;
      const startY = currentY;
      const startTime = performance.now();
      const duration = 800;

      function walkFrame(time) {
        const elapsed = time - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        currentX = startX + (target.x - startX) * progress;
        currentY = startY + (target.y - startY) * progress;

        emberWalker.style.left = `${currentX}%`;
        emberWalker.style.top = `${currentY}%`;

        if (progress < 1) {
          requestAnimationFrame(walkFrame);
        } else {
          isMoving = false;
          emberWalker.classList.remove('is-walking');
          openModal(landmarkKey);
        }
      }
      requestAnimationFrame(walkFrame);
    }

    function toggleMushroomStatus() {
      isLostState = !isLostState;
      statusBtn.textContent = isLostState ? "● Ember is lost" : "● Ember is home";
      statusBtn.style.background = isLostState ? "#721c24" : "#155724";
    }

    function openModal(type) {
      closeModal();
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      let content = '';
      if (type === 'table') {
        content = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3 style="color: #ffd166; margin-top: 0;">📖 Ember's Journal</h3>
            <div class="book-stage">
              <div class="book-page-container" id="bookPageText">
                Hello, friend. My name is Ember, but the people who love me most call me Mama.
              </div>
            </div>
            <div class="book-footer">
              <button class="action-btn" id="prevPageBtn" onclick="turnPage(-1)" disabled>Previous</button>
              <span id="pageIndicator" style="color:#8d99ae;">Page 1 of 6</span>
              <button class="action-btn" id="nextPageBtn" onclick="turnPage(1)">Next</button>
            </div>
          </div>
        `;
      } else {
        content = `
          <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h3>${coordinates[type]?.name || 'Notice'}</h3>
            <p>Welcome to this cozy section of Ember's forest trail!</p>
          </div>
        `;
      }

      overlay.innerHTML = content;
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
      });
      document.body.appendChild(overlay);
      activeModal = overlay;
    }

    window.closeModal = function() {
      if (activeModal) {
        activeModal.remove();
        activeModal = null;
      }
    };

    const pages = [
      "Hello, friend. My name is Ember, but the people who love me most call me Mama.",
      "I wasn't always the fearless little explorer you see today. Once upon a time, I was just a tiny kitten with curious eyes and paws that could never stay still.",
      "As I grew, I became known for carrying my little traveler stick, convinced every great explorer needed supplies for the journey ahead.",
      "But no matter how exciting the adventure became, there was always one place that mattered more than any forest: Home.",
      "My family loves me more than all the stars in the night sky and worry when I wander too far.",
      "If you've found me, thank you for helping a little adventurer find her way back home. ❤️"
    ];
    let currentPage = 0;

    window.turnPage = function(dir) {
      const next = currentPage + dir;
      if (next < 0 || next >= pages.length) return;
      currentPage = next;
      document.getElementById('bookPageText').innerHTML = pages[currentPage];
      document.getElementById('pageIndicator').textContent = `Page ${currentPage + 1} of ${pages.length}`;
      document.getElementById('prevPageBtn').disabled = (currentPage === 0);
      document.getElementById('nextPageBtn').disabled = (currentPage === pages.length - 1);
    };
  </script>
</body>
</html>
