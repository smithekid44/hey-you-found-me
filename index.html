<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forest of Ember</title>
  <style>
    /* ==========================================
       GHIBLI NIGHT FOREST THEME & RESET
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif, 'Segoe UI', sans-serif;
      background-color: #07111e;
      color: #f1f5f9;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
       COZY NAVIGATION BAR
       ========================================== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2.5rem;
      background: linear-gradient(180deg, rgba(7, 17, 30, 0.95) 0%, rgba(7, 17, 30, 0) 100%);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: bold;
      font-size: 1.3rem;
      color: #ffd166;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.4);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 1rem;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffd166;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    /* Music Pill */
    .music-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 209, 102, 0.3);
      color: #ffd166;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .music-pill:hover {
      background: rgba(255, 209, 102, 0.15);
      border-color: #ffd166;
    }

    .music-pill.is-playing {
      border-color: #06d6a0;
      color: #06d6a0;
      box-shadow: 0 0 12px rgba(6, 214, 160, 0.4);
    }

    /* Interactive Status Badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(6, 214, 160, 0.15);
      border: 1px solid #06d6a0;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #06d6a0;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px rgba(6, 214, 160, 0.2);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #06d6a0;
      box-shadow: 0 0 8px #06d6a0;
    }

    /* Missing State Styling */
    .status-badge.is-missing {
      background: rgba(239, 71, 111, 0.18);
      border-color: #ef476f;
      color: #ef476f;
      box-shadow: 0 0 12px rgba(239, 71, 111, 0.3);
    }

    .status-badge.is-missing .status-dot {
      background-color: #ef476f;
      box-shadow: 0 0 8px #ef476f;
    }

    /* ==========================================
       HERO / GHIBLI FOREST STAGE
       ========================================== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 7rem 2rem 3rem 2rem;
      background: radial-gradient(circle at 50% 30%, #172c4a 0%, #07111e 75%);
      overflow: hidden;
    }

    /* Moon Glow */
    .moon {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #fffdf0 0%, #ffe3a8 60%, rgba(255, 227, 168, 0) 100%);
      border-radius: 50%;
      opacity: 0.25;
      filter: blur(8px);
      pointer-events: none;
    }

    /* Fireflies */
    #fireflies {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .firefly {
      position: absolute;
      width: 5px;
      height: 5px;
      background-color: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffd166, 0 0 20px #ffd166;
      animation: float 7s infinite ease-in-out;
      opacity: 0;
    }

    @keyframes float {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      50% { opacity: 0.9; transform: translateY(-35px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.6); }
    }

    /* TREE SILHOUETTES */
    .forest-back-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 320px;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .tree-layer-back {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 260px;
      opacity: 0.45;
      fill: #0d1e33;
    }

    .tree-layer-front {
      position: absolute;
      bottom: -10px;
      width: 100%;
      height: 220px;
      fill: #050d18;
    }

    /* FULL-WIDTH STONE PATH - ALIGNED WITH EMBER */
    .stone-path {
      position: absolute;
      bottom: 125px;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 4;
      pointer-events: none;
    }

    .forest-mist {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: linear-gradient(0deg, #07111e 10%, rgba(7, 17, 30, 0) 100%);
      z-index: 3;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 850px;
      width: 100%;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.4rem;
      color: #fffdf0;
      font-weight: normal;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    p.subtitle {
      color: #a0aec0;
      margin-bottom: 1.5rem;
      font-size: 1.15rem;
      font-style: italic;
    }

    /* Ghibli Dialogue Speech Bubble */
    .speech-bubble {
      position: relative;
      background: rgba(22, 38, 59, 0.75);
      border: 1.5px solid rgba(255, 209, 102, 0.35);
      padding: 1.1rem 1.8rem;
      border-radius: 18px;
      margin: 0 auto 2rem auto;
      max-width: 500px;
      font-style: italic;
      color: #ffd166;
      backdrop-filter: blur(8px);
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* ==========================================
       MAIN INTERACTION GRID (LEFT STACK & EMBER)
       ========================================== */
    .interactive-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      width: 100%;
    }

    /* STACKED BUTTONS ON THE LEFT */
    .hero-buttons-stacked {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 220px;
      flex-shrink: 0;
      z-index: 15;
    }

    button.btn-story-orange,
    button.btn-story-green {
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.6rem;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
      width: 100%;
    }

    .btn-story-orange {
      background: linear-gradient(135deg, #e76f51 0%, #d45d42 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(231, 111, 81, 0.35);
    }

    .btn-story-orange:hover {
      background: linear-gradient(135deg, #f4a261 0%, #e76f51 100%);
      transform: translateX(4px);
      box-shadow: 0 6px 16px rgba(231, 111, 81, 0.5);
    }

    .btn-story-green {
      background: linear-gradient(135deg, #2a9d8f 0%, #1e7167 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(42, 157, 143, 0.35);
    }

    .btn-story-green:hover {
      background: linear-gradient(135deg, #3eb4a5 0%, #2a9d8f 100%);
      transform: translateX(4px);
      box-shadow: 0 6px 16px rgba(42, 157, 143, 0.5);
    }

    /* EMBER STAGE & WALKING TRACK */
    .character-stage {
      position: relative;
      flex-grow: 1;
      height: 180px;
    }

    .ember-wrapper {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      width: 150px;
      height: 150px;
      cursor: pointer;
      z-index: 5;
      will-change: transform;
    }

    .ember-char {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Animated Walking Body */
    .ember-body-group {
      transform-origin: 50% 80%;
      animation: walkBob 0.4s infinite alternate ease-in-out;
    }

    .ember-body-group.fast-walk {
      animation: walkBob 0.22s infinite alternate ease-in-out;
    }

    /* Synchronized Dynamic Ground Shadow */
    .ground-shadow {
      transform-origin: 50px 85px;
      animation: shadowPulse 0.4s infinite alternate ease-in-out;
    }

    .ground-shadow.fast-walk {
      animation: shadowPulse 0.22s infinite alternate ease-in-out;
    }

    @keyframes walkBob {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-10px) rotate(3deg); }
    }

    @keyframes shadowPulse {
      0% { transform: scaleX(1) scaleY(1); opacity: 0.95; }
      100% { transform: scaleX(0.7) scaleY(0.6); opacity: 0.4; }
    }

    /* ==========================================
       MODAL DIALOG
       ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 17, 30, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #122236;
      border: 1px solid rgba(255, 209, 102, 0.3);
      border-radius: 16px;
      padding: 2.2rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-card h2 {
      color: #ffd166;
      margin-bottom: 0.6rem;
      font-weight: normal;
    }

    .modal-card p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      line-height: 1.5;
    }

    .close-btn {
      background: #e76f51;
      border: none;
      color: #fff;
      padding: 0.6rem 1.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
    }

    /* Responsive adjustment for small screens */
    @media (max-width: 768px) {
      .interactive-container {
        flex-direction: column-reverse;
      }
      .hero-buttons-stacked {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Dialogue Lists
    const safePhrases = [
      '"The stars are bright tonight..."',
      '"Did you bring any sweet berries?"',
      '"Listen closely to the wind in the pines..."',
      '"The fireflies are dancing early!"',
      '"I feel safe when the lanterns glow."'
    ];

    const missingPhrases = [
      '"Where did everybody go...?"',
      '"I think I took a wrong turn at the big oak tree..."',
      '"Is someone holding a lantern?"',
      '"The shadows look bigger over here..."'
    ];

    // DOM Elements
    const emberWrapper = document.getElementById('ember-wrapper');
    const emberBodyGroup = document.getElementById('ember-body-group');
    const groundShadow = document.getElementById('ground-shadow');
    const speechBubble = document.getElementById('speech-bubble');
    const interactBtn = document.getElementById('interact-btn');
    const stage = document.getElementById('character-stage');

    function speakNextPhrase() {
      const activeList = isMissing ? missingPhrases : safePhrases;
      const randomPhrase = activeList[Math.floor(Math.random() * activeList.length)];
      speechBubble.textContent = randomPhrase;

      // Click reaction pulse
      emberBodyGroup.style.transform = 'scale(1.1)';
      setTimeout(() => {
        emberBodyGroup.style.transform = '';
      }, 200);
    }

    emberWrapper.addEventListener('click', speakNextPhrase);
    interactBtn.addEventListener('click', speakNextPhrase);

    // ==========================================
    // AUDIO AMBIENCE CONTROL
    // ==========================================
    const musicBtn = document.getElementById('music-btn');
    const musicLabel = document.getElementById('music-label');
    const audio = document.getElementById('forest-audio');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        audio.play().catch(err => console.log("Audio waiting for user click", err));
        musicBtn.classList.add('is-playing');
        musicLabel.textContent = 'Playing';
      } else {
        audio.pause();
        musicBtn.classList.remove('is-playing');
        musicLabel.textContent = 'Ambience';
      }
    });

    // ==========================================
    // EMBER CONTINUOUS WALKING ENGINE
    // ==========================================
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const toggleStatusBtn = document.getElementById('toggle-status-btn');

    let isMissing = false;
    let positionX = 0;       
    let direction = 1;       
    let walkSpeed = 1.0; 

    function updateEmberWalk() {
      const stageWidth = stage.clientWidth || 300;
      const emberWidth = emberWrapper.clientWidth || 150;
      const maxRange = (stageWidth - emberWidth) / 2;

      positionX += walkSpeed * direction;

      // Reverse direction at stage edges
      if (positionX >= maxRange) {
        positionX = maxRange;
        direction = -1;
      } else if (positionX <= -maxRange) {
        positionX = -maxRange;
        direction = 1;
      }

      // Flip SVG based on movement vector
      const flipScale = direction === -1 ? 'scaleX(-1)' : 'scaleX(1)';
      emberWrapper.style.transform = `translateX(-50%) translateX(${positionX}px) ${flipScale}`;

      requestAnimationFrame(updateEmberWalk);
    }

    function toggleEmberStatus() {
      isMissing = !isMissing;

      if (isMissing) {
        // Missing State - Walk Faster & Faster Bobbing/Shadow Pulse
        statusBadge.classList.add('is-missing');
        statusText.textContent = 'MISSING';
        toggleStatusBtn.innerHTML = '🐾 Mark Ember Safe';
        speechBubble.textContent = '"Where did everybody go...?"';
        
        walkSpeed = 2.2;
        emberBodyGroup.classList.add('fast-walk');
        groundShadow.classList.add('fast-walk');
      } else {
        // Safe State - Calm Walk Speed
        statusBadge.classList.remove('is-missing');
        statusText.textContent = 'SAFE';
        toggleStatusBtn.innerHTML = '🐾 Mark Ember Lost';
        speechBubble.textContent = '"The stars are bright tonight..."';

        walkSpeed = 1.0;
        emberBodyGroup.classList.remove('fast-walk');
        groundShadow.classList.remove('fast-walk');
      }
    }

    statusBadge.addEventListener('click', toggleEmberStatus);
    toggleStatusBtn.addEventListener('click', toggleEmberStatus);

    // Start walking immediately on page render
    requestAnimationFrame(updateEmberWalk);

    // ==========================================
    // MODAL DIALOG CONTROLS
    // ==========================================
    const reportBtn = document.getElementById('report-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const closeModal = document.getElementById('close-modal');

    reportBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
    });

    closeModal.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    // Fireflies Generator
    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 22; i++) {
      const firefly = document.createElement('div');
      firefly.className = 'firefly';
      firefly.style.left = Math.random() * 100 + 'vw';
      firefly.style.top = Math.random() * 80 + 10 + 'vh';
      firefly.style.animationDelay = Math.random() * 7 + 's';
      firefly.style.animationDuration = (Math.random() * 4 + 5) + 's';
      fireflyContainer.appendChild(firefly);
    }
  </script>
</body>
</html>
