<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hey You Found Me - Ember</title>
  
  <style>
    /* ==========================================
        GHIBLI NIGHT FOREST THEME & RESET
        ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif, 'Segoe UI', sans-serif;
      background-color: #050b14;
      color: #f1f5f9;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
        COZY NAVIGATION BAR
        ========================================== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background: linear-gradient(180deg, rgba(5, 11, 20, 0.98) 0%, rgba(5, 11, 20, 0) 100%);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      gap: 1rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: bold;
      font-size: 0.85rem;
      color: #ffd166;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.4);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.2rem;
    }

    .nav-links a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffd166;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(6, 214, 160, 0.15);
      border: 1px solid #06d6a0;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #06d6a0;
      user-select: none;
      box-shadow: 0 0 8px rgba(6, 214, 160, 0.2);
      white-space: nowrap;
    }

    .status-badge.lost {
      background: rgba(239, 71, 111, 0.15);
      border-color: #ef476f;
      color: #ef476f;
      box-shadow: 0 0 8px rgba(239, 71, 111, 0.2);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #06d6a0;
      box-shadow: 0 0 8px #06d6a0;
      flex-shrink: 0;
    }

    .status-badge.lost .status-dot {
      background-color: #ef476f;
      box-shadow: 0 0 8px #ef476f;
    }

    /* ==========================================
        HERO / GHIBLI FOREST STAGE
        ========================================== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 7rem 2rem 3rem 2rem;
      background: radial-gradient(circle at 50% 25%, #132743 0%, #07111e 60%, #03070c 100%);
      overflow: hidden;
    }

    .forest-canopy-back {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 35vh;
      background: linear-gradient(to top, #040910, transparent);
      z-index: 2;
      pointer-events: none;
    }

    .moon {
      position: absolute;
      top: 10%;
      left: 55%;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, #fffdf0 0%, #ffe3a8 55%, rgba(255, 227, 168, 0) 100%);
      border-radius: 50%;
      opacity: 0.22;
      filter: blur(8px);
      pointer-events: none;
    }

    #fireflies {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    .firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffd166;
      animation: float 7s infinite ease-in-out;
      opacity: 0;
    }

    @keyframes float {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      50% { opacity: 0.9; transform: translateY(-30px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.6); }
    }

    .hero-content-wrapper {
      position: relative;
      z-index: 10;
      max-width: 1250px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4rem;
    }

    .hero-left-col {
      display: flex;
      flex-direction: column;
      flex: 1;
      max-width: 440px;
      text-align: left;
    }

    .hero-greeting {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: #f3c68f;
      margin-bottom: -0.3rem;
    }

    h1 {
      font-size: clamp(2.3rem, 5vw, 3.5rem);
      font-weight: normal;
      color: #fffdf0;
      letter-spacing: 1px;
      margin-bottom: 1rem;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .hero-subtext {
      color: #b2bec3;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .found-ember-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #d47a3d, #b85d22);
      color: #fffdf0;
      padding: 0.8rem 1.5rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 4px 15px rgba(212, 122, 61, 0.4);
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 209, 102, 0.3);
      cursor: pointer;
      width: fit-content;
      align-self: flex-start;
    }

    .found-ember-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 122, 61, 0.6);
      background: linear-gradient(135deg, #e08a47, #c96b2e);
    }

    .character-stage {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      flex-shrink: 0;
    }

    .forest-bg-svg {
      position: absolute;
      bottom: -10px;
      width: 100%;
      height: 140px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.65;
    }

    /* ==========================================
        MUSHROOM CLUSTER STYLES & GLOW ANIMATIONS
        ========================================== */
    .mushroom-cluster {
      position: absolute;
      bottom: 25px;
      right: 30px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      z-index: 6;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .glowing-mushroom {
      background: transparent;
      border: none;
      padding: 0;
      pointer-events: none;
      position: relative;
      transition: transform 0.2s ease;
    }

    .mushroom-cluster:hover {
      transform: scale(1.15);
    }

    .mushroom-main {
      width: 26px;
      height: 26px;
    }

    .mushroom-side-1 {
      width: 20px;
      height: 20px;
      margin-bottom: -2px;
    }

    .mushroom-side-2 {
      width: 16px;
      height: 16px;
      margin-bottom: -4px;
    }

    .shroom-cap {
      background-color: #e08a47;
      border-radius: 12px 12px 4px 4px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      margin: 0 auto;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-cap {
      width: 24px;
      height: 15px;
    }

    .mushroom-side-1 .shroom-cap {
      width: 18px;
      height: 12px;
    }

    .mushroom-side-2 .shroom-cap {
      width: 15px;
      height: 10px;
    }

    .shroom-stem {
      background-color: #f3c68f;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      margin: 0 auto;
      border-radius: 2px;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-stem {
      width: 8px;
      height: 13px;
    }

    .mushroom-side-1 .shroom-stem {
      width: 6px;
      height: 10px;
    }

    .mushroom-side-2 .shroom-stem {
      width: 5px;
      height: 8px;
    }

    .glowing-mushroom.mushroom-glowing .shroom-cap {
      background-color: #06d6a0 !important;
      box-shadow: 0 0 14px #06d6a0, 0 0 24px #118ab2;
    }

    .glowing-mushroom.mushroom-glowing .shroom-stem {
      background-color: #a9def9 !important;
      box-shadow: 0 0 10px #06d6a0;
    }

    .ember-wrapper {
      position: absolute;
      width: 240px;
      height: 240px;
      z-index: 5;
      will-change: transform;
      pointer-events: none;
    }

    .ember-char {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ember-body-group {
      transform-origin: 65px 75px;
      transform: scaleX(-1);
      animation: continuousWalkAnim 0.24s infinite alternate ease-in-out;
    }

    .ground-shadow {
      transform-origin: 65px 102px;
      animation: shadowWalkPulse 0.24s infinite alternate ease-in-out;
    }

    .leg-back-left {
      transform-origin: 46px 82px;
      animation: legMoveBack 0.24s infinite alternate ease-in-out;
    }

    .leg-back-right {
      transform-origin: 80px 82px;
      animation: legMoveFront 0.24s infinite alternate ease-in-out;
    }

    .leg-front-left {
      transform-origin: 54px 84px;
      animation: legMoveBack 0.24s infinite alternate ease-in-out;
    }

    .leg-front-right {
      transform-origin: 72px 84px;
      animation: legMoveFront 0.24s infinite alternate ease-in-out;
    }

    .tail-group {
      transform-origin: 92px 85px;
      animation: tailSwishNormal 1.2s infinite ease-in-out;
    }

    .head-group {
      transform-origin: 65px 45px;
    }

    @keyframes legMoveBack {
      0% { transform: translateY(0px) rotate(-12deg); }
      100% { transform: translateY(-3px) rotate(12deg); }
    }

    @keyframes legMoveFront {
      0% { transform: translateY(-3px) rotate(12deg); }
      100% { transform: translateY(0px) rotate(-12deg); }
    }

    @keyframes continuousWalkAnim {
      0% { transform: scaleX(-1) translateY(0px) rotate(-1.5deg); }
      100% { transform: scaleX(-1) translateY(-6px) rotate(1.5deg); }
    }

    @keyframes shadowWalkPulse {
      0% { transform: scaleX(1) scaleY(1); opacity: 0.75; }
      100% { transform: scaleX(0.82) scaleY(0.55); opacity: 0.4; }
    }

    @keyframes tailSwishNormal {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    /* ==========================================
        EXPLORE EMBER'S WORLD SECTION (NEW WIDGET)
        ========================================== */
    .explore-world-section {
      position: relative;
      width: 100%;
      padding: 5rem 1rem 6rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #03070c;
    }

    .explore-title-wrapper {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .explore-title-wrapper h2 {
      font-family: 'Georgia', serif;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      color: #fffdf0;
      font-weight: normal;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      display: inline-flex;
      align-items: center;
      gap: 1rem;
    }

    .explore-title-wrapper h2::before,
    .explore-title-wrapper h2::after {
      content: '🌿';
      font-size: 1rem;
    }

    /* Interactive Forest Panorama Container */
    .world-panorama-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 480px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 209, 102, 0.25);
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 25px rgba(255, 209, 102, 0.1);
      background: #07111e;
    }

    .world-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85) contrast(1.05);
      display: block;
    }

    .world-vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 80px rgba(3, 7, 12, 0.7);
      pointer-events: none;
    }

    /* Interactive Destination Hotspot Buttons */
    .destination-hotspot {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(15, 28, 45, 0.85);
      border: 1px solid rgba(255, 209, 102, 0.5);
      color: #fffdf0;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 10px rgba(255, 209, 102, 0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 10;
      white-space: nowrap;
    }

    .destination-hotspot:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: #d47a3d;
      border-color: #ffd166;
      box-shadow: 0 6px 20px rgba(212, 122, 61, 0.6), 0 0 15px rgba(255, 209, 102, 0.5);
    }

    .hotspot-icon {
      font-size: 1rem;
    }

    .hotspot-text {
      font-size: 0.85rem;
      font-family: 'Georgia', serif;
      letter-spacing: 0.5px;
    }

    /* Positioning respective destinations along paths in the panorama image */
    .hotspot-cabin { top: 48% = document.getElementById('contactModal');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModal');
    const smsForm = document.getElementById('smsForm');

    if (openBtn) {
      openBtn.addEventListener('click', (e) => {
        e.preventDefault();
        modal.style.display = 'flex';
      });
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });
    }

    window.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.style.display = 'none';
      }
    });

    // Handle Form Submit -> Fires native SMS link to 616-309-0059
    if (smsForm) {
      smsForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const phone = document.getElementById('finderPhone').value;
        const msg = document.getElementById('finderMessage').value;
        
        const smsBody = encodeURIComponent(`I found Ember! My phone is ${phone}. Message: ${msg}`);
        window.location.href = `sms:6163090059?body=${smsBody}`;
        
        modal.style.display = 'none';
      });
    }
  </script>
</body>
</html>
