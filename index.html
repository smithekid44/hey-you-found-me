    .map-vector-overlay {

    /* Dropped letter on map stage style */
    .dropped-letter-node {
      position: absolute;

      height: 24px;

      align-items: center;
      justify-content: center;
      animation: letterPulse 1.5s infinite alternate ease-in-out;
    }

    .dropped-letter-node::after {
      content: '';
      position: absolute;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 10px solid #e6d5b8;
      top: 0;
    }

    @keyframes letterPulse {
      0% { transform: translate(-50%, -50%) scale(1) translateY(0); filter: drop-shadow(0 0 4px rgba(255,209,102,0.4)); }
      100% { transform: translate(-50%, -50%) scale(1.1) translateY(-4px); filter: drop-shadow(0 0 10px rgba(255,209,102,0.9)); }
    }

    /* ==========================================

    .click-pawprint {

      color: #ffd166;
      text-shadow: 0 0 10px #ffd166, 0 0 20px #06d6a0, 0 0 30px #118ab2;
      opacity: 0;
      animation: pawprintPopBelow 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pawprintPopBelow {

      }

      }
      100% {
        transform: translate(-50%, 35%) scale(1) rotate(0deg);
        opacity: 0;
      }
    }
