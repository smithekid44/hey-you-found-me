<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forest of Ember</title>
  <style>
    /* ==========================================
       RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b131e;
      color: #e2e8f0;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
       NAVIGATION BAR
       ========================================== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(11, 19, 30, 0.85);
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: bold;
      font-size: 1.25rem;
      color: #ffd166;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      transition: color 0.3s ease;
      font-size: 0.95rem;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffd166;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Music Pill */
    .music-pill {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .music-pill:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .music-pill.is-playing {
      border-color: #06d6a0;
      color: #06d6a0;
      box-shadow: 0 0 10px rgba(6, 214, 160, 0.3);
    }

    /* Status Pill Toggle */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(6, 214, 160, 0.15);
      border: 1px solid #06d6a0;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #06d6a0;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #06d6a0;
      box-shadow: 0 0 8px #06d6a0;
    }

    /* Missing State Styling */
    .status-pill.is-missing {
      background: rgba(239, 71, 111, 0.15);
      border-color: #ef476f;
      color: #ef476f;
    }

    .status-pill.is-missing .status-dot {
      background-color: #ef476f;
      box-shadow: 0 0 8px #ef476f;
    }

    .hamburger-btn {
      display: none;
      flex-direction: column;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
    }

    .hamburger-btn span {
      width: 24px;
      height: 2px;
      background-color: #e2e8f0;
      transition: all 0.3s ease;
    }

    /* ==========================================
       HERO / STAGE AREA
       ========================================== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6rem 2rem 2rem 2rem;
      background: linear-gradient(180deg, #0b131e 0%, #172a3a 100%);
      overflow: hidden;
    }

    /* Dynamic Fireflies Container */
    #fireflies {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ffd166;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffd166;
      animation: float 8s infinite ease-in-out;
      opacity: 0;
    }

    @keyframes float {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      50% { opacity: 0.8; transform: translateY(-30px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #f8fafc;
      letter-spacing: 1px;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    /* Dialogue Speech Bubble */
    .speech-bubble {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      margin-bottom: 2.5rem;
      font-style: italic;
      color: #ffd166;
      backdrop-filter: blur(5px);
      min-height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ember Character SVG Frame */
    .character-stage {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 2rem auto;
      cursor: pointer;
    }

    .ember-char {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease;
    }

    /* Idle SVG Animation */
    .ember-idle {
      animation: breathe 3s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }

    /* Walking SVG Animation */
    .ember-walking {
      animation: walk 0.6s infinite alternate ease-in-out;
    }

    @keyframes walk {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-8px) rotate(3deg); }
    }

    /* Hero Wooden Style Buttons */
    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button.btn-wooden-orange,
    button.btn-wooden-dark {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-wooden-orange {
      background: #e76f51;
      color: #ffffff;
      box-shadow: 0 4px 0 #b5482f;
    }

    .btn-wooden-orange:hover {
      background: #f4a261;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #b5482f;
    }

    .btn-wooden-orange:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #b5482f;
    }

    .btn-wooden-dark {
      background: #2a9d8f;
      color: #ffffff;
      box-shadow: 0 4px 0 #1d6e64;
    }

    .btn-wooden-dark:hover {
      background: #3eb4a5;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #1d6e64;
    }

    .btn-wooden-dark:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1d6e64;
    }

    /* ==========================================
       MODAL OVERLAY
       ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #172a3a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
      text-align: center;
      position: relative;
    }

    .modal-card h2 {
      color: #ffd166;
      margin-bottom: 0.5rem;
    }

    .modal-card p {
      color: #cbd5e1;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .close-btn {
      background: #e76f51;
      border: none;
      color: #fff;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Responsive Queries */
    @media (max-width: 768px) {
      .hamburger-btn {
        display: flex;
      }

      .nav-links {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: #0b131e;
        flex-direction: column;
        padding: 1rem 2rem;
        gap: 1rem;
        display: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .nav-links.nav-open {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- AUDIO ELEMENT -->
  <audio id="forest-audio" loop>
    <source src="https://assets.mixkit.co/active_storage/sfx/2432/2432-preview.mp3" type="audio/mpeg">
  </audio>

  <!-- NAVIGATION BAR -->
  <nav class="navbar">
    <div class="nav-logo">
      <span class="logo-icon">🌲</span>
      <span class="logo-text">EMBER</span>
    </div>

    <ul class="nav-links" id="nav-links">
      <li><a href="#hero" class="active">Forest</a></li>
      <li><a href="#explore">Lore</a></li>
      <li><a href="#kindness">Map</a></li>
    </ul>

    <div class="nav-right">
      <!-- Music Button -->
      <button class="music-pill" id="music-btn" title="Toggle Forest Ambience">
        <span class="music-icon">🎵</span>
        <span class="music-label">Ambience</span>
      </button>

      <!-- Interactive Status Pill -->
      <div class="status-pill" id="status-pill" role="button" tabindex="0">
        <span class="status-dot"></span>
        <span class="status-text">SAFE</span>
      </div>

      <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle Navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero" id="hero">
    <div id="fireflies"></div>

    <div class="content">
      <h1>The Moonlit Canopy</h1>
      <p class="subtitle">Ember the forest spirit is resting nearby.</p>

      <!-- Dynamic Dialogue -->
      <div class="speech-bubble" id="speech-bubble">
        "The stars are bright tonight..."
      </div>

      <!-- Ember SVG Character -->
      <div class="character-stage">
        <svg class="ember-char ember-idle" id="ember-character" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ears -->
          <polygon points="30,35 20,15 42,28" fill="#e76f51" />
          <polygon points="70,35 80,15 58,28" fill="#e76f51" />
          <polygon points="32,33 24,18 40,28" fill="#f4a261" />
          <polygon points="68,33 76,18 60,28" fill="#f4a261" />
          <!-- Head / Body -->
          <ellipse cx="50" cy="55" rx="30" ry="25" fill="#e76f51" />
          <!-- Face Fur Mask -->
          <path d="M 30,55 Q 50,75 70,55 Q 50,45 30,55 Z" fill="#f4a261" />
          <!-- Eyes -->
          <circle cx="40" cy="50" r="3" fill="#0b131e" />
          <circle cx="60" cy="50" r="3" fill="#0b131e" />
          <circle cx="41" cy="49" r="1" fill="#ffffff" />
          <circle cx="61" cy="49" r="1" fill="#ffffff" />
          <!-- Nose -->
          <polygon points="48,56 52,56 50,59" fill="#0b131e" />
          <!-- Paws -->
          <ellipse cx="38" cy="78" rx="6" ry="4" fill="#d45d42" />
          <ellipse cx="62" cy="78" rx="6" ry="4" fill="#d45d42" />
        </svg>
      </div>

      <!-- Action Buttons -->
      <div class="hero-buttons">
        <button class="btn-wooden-orange" id="interact-btn">
          <span>🗣️</span> Speak to Ember
        </button>
        
        <button class="btn-wooden-dark" id="toggle-status-btn">
          <span>🐾</span> Mark Ember Lost
        </button>

        <button class="btn-wooden-dark" id="report-btn">
          <span>📡</span> Signal Location
        </button>
      </div>
    </div>
  </section>

  <!-- MODAL DIALOG -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <h2>Signal Sent!</h2>
      <p>A lantern beacon has been illuminated over Ember's last recorded coordinates.</p>
      <button class="close-btn" id="close-modal">Dismiss</button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Navigation Hamburger Toggle
    const hamburgerBtn = document.getElementById('hamburger-btn');
    const navLinks = document.getElementById('nav-links');

    hamburgerBtn.addEventListener('click', () => {
      navLinks.classList.toggle('nav-open');
    });

    // Ember Dialogue Interaction
    const emberChar = document.getElementById('ember-character');
    const speechBubble = document.getElementById('speech-bubble');
    const interactBtn = document.getElementById('interact-btn');

    const phrases = [
      '"The stars are bright tonight..."',
      '"Did you bring any sweet berries?"',
      '"Listen closely to the wind in the pines..."',
      '"The fireflies are dancing early!"',
      '"I feel safe when the lanterns glow."'
    ];

    function speakNextPhrase() {
      const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
      speechBubble.textContent = randomPhrase;

      // Pulse animation trigger on character click
      emberChar.style.transform = 'scale(1.08)';
      setTimeout(() => {
        emberChar.style.transform = '';
      }, 200);
    }

    emberChar.addEventListener('click', speakNextPhrase);
    interactBtn.addEventListener('click', speakNextPhrase);

    // ==========================================
    // AUDIO AMBIENCE CONTROL
    // ==========================================
    const musicBtn = document.getElementById('music-btn');
    const audio = document.getElementById('forest-audio');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        audio.play().catch(err => console.log("Audio playback waiting for interaction: ", err));
        musicBtn.classList.add('is-playing');
        musicBtn.querySelector('.music-label').textContent = 'Playing';
      } else {
        audio.pause();
        musicBtn.classList.remove('is-playing');
        musicBtn.querySelector('.music-label').textContent = 'Ambience';
      }
    });

    // ==========================================
    // EMBER STATUS & WALKING TOGGLE
    // ==========================================
    const statusPill = document.getElementById('status-pill');
    const toggleStatusBtn = document.getElementById('toggle-status-btn');
    const statusText = statusPill.querySelector('.status-text');

    let isMissing = false;

    function toggleEmberStatus() {
      isMissing = !isMissing;

      if (isMissing) {
        // Switch to Missing state
        statusPill.classList.add('is-missing');
        statusText.textContent = 'MISSING';
        toggleStatusBtn.querySelector('span:nth-child(2)').textContent = ' Mark Ember Safe';
        speechBubble.textContent = '"Where did everybody go...?"';

        // Switch SVG animation from idle to walking loop
        emberChar.classList.remove('ember-idle');
        emberChar.classList.add('ember-walking');
      } else {
        // Return to Safe state
        statusPill.classList.remove('is-missing');
        statusText.textContent = 'SAFE';
        toggleStatusBtn.querySelector('span:nth-child(2)').textContent = ' Mark Ember Lost';
        speechBubble.textContent = '"The stars are bright tonight..."';

        // Return SVG animation to idle
        emberChar.classList.remove('ember-walking');
        emberChar.classList.add('ember-idle');
      }
    }

    // Bind toggle action to both the pill and the button
    statusPill.addEventListener('click', toggleEmberStatus);
    toggleStatusBtn.addEventListener('click', toggleEmberStatus);

    // ==========================================
    // MODAL CONTROLS
    // ==========================================
    const reportBtn = document.getElementById('report-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const closeModal = document.getElementById('close-modal');

    reportBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
    });

    closeModal.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });

    // ==========================================
    // GENERATE DYNAMIC FIREFLIES
    // ==========================================
    const fireflyContainer = document.getElementById('fireflies');
    for (let i = 0; i < 20; i++) {
      const firefly = document.createElement('div');
      firefly.className = 'firefly';
      firefly.style.left = Math.random() * 100 + 'vw';
      firefly.style.top = Math.random() * 80 + 10 + 'vh';
      firefly.style.animationDelay = Math.random() * 8 + 's';
      firefly.style.animationDuration = (Math.random() * 5 + 5) + 's';
      fireflyContainer.appendChild(firefly);
    }
  </script>
</body>
</html>
