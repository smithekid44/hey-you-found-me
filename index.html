<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hey You Found Me - Ember</title>
  
  <style>
    /* ==========================================
        GHIBLI NIGHT FOREST THEME & RESET
        ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Georgia', serif, 'Segoe UI', sans-serif;
      background-color: #050b14;
      color: #f1f5f9;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================
        COZY NAVIGATION BAR
        ========================================== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      background: linear-gradient(180deg, rgba(5, 11, 20, 0.98) 0%, rgba(5, 11, 20, 0) 100%);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      gap: 1rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      cursor: pointer;
      position: relative;
    }

    .nav-logo-icon {
      width: 28px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-logo-icon svg {
      width: 100%;
      height: 100%;
      fill: #f3c68f;
      filter: drop-shadow(0 0 6px rgba(243, 198, 143, 0.4));
    }

    .nav-logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      color: #fffdf0;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.3);
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.2rem;
    }

    .nav-links a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #ffd166;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.6);
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(6, 214, 160, 0.15);
      border: 1px solid #06d6a0;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #06d6a0;
      user-select: none;
      box-shadow: 0 0 8px rgba(6, 214, 160, 0.2);
      white-space: nowrap;
    }

    .status-badge.lost {
      background: rgba(239, 71, 111, 0.15);
      border-color: #ef476f;
      color: #ef476f;
      box-shadow: 0 0 8px rgba(239, 71, 111, 0.2);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #06d6a0;
      box-shadow: 0 0 8px #06d6a0;
      flex-shrink: 0;
    }

    .status-badge.lost .status-dot {
      background-color: #ef476f;
      box-shadow: 0 0 8px #ef476f;
    }

    /* ==========================================
        MAIN EXPANDED TREASURE MAP LAYOUT
        ========================================== */
    .main-stage-container {
      position: relative;
      width: 100%;
      max-width: 1100px;
      margin: 4.8rem auto 2rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .top-intro-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0 0.5rem;
    }

    .hero-greeting {
      font-family: 'Georgia', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: #f3c68f;
    }

    h1 {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: normal;
      color: #fffdf0;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .hero-subtext {
      color: #b2bec3;
      font-size: 0.85rem;
      line-height: 1.4;
      max-width: 550px;
    }

    /* ==========================================
        TREASURE MAP CIRCULAR FOREST STAGE
        ========================================== */
    .world-panorama-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 680px;
      margin: 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 209, 102, 0.4);
      box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 35px rgba(255, 209, 102, 0.15), inset 0 0 60px rgba(5, 11, 20, 0.7);
      background: #07111e;
      cursor: pointer;
    }

    .world-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.8) contrast(1.1) sepia(0.15);
      display: block;
    }

    .world-vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 100px rgba(3, 7, 12, 0.85);
      pointer-events: none;
      border-radius: 50%;
    }

    /* ==========================================
        VECTOR ART STAGE OBJECTS & HOTSPOTS
        ========================================== */
    .map-vector-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .landmark-hotspot {
      position: absolute;
      z-index: 12;
      background: transparent;
      border: none;
      cursor: pointer;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }
    .landmark-hotspot:hover {
      background: rgba(255, 209, 102, 0.1);
      box-shadow: 0 0 15px rgba(255, 209, 102, 0.3);
    }

    /* ==========================================
        GLOWING PAWPRINT EFFECT
        ========================================== */
    .click-pawprint {
      position: fixed;
      transform: translate(-50%, -50%) scale(0.3);
      pointer-events: none;
      z-index: 1000;
      font-size: 1.8rem;
      color: #ffd166;
      text-shadow: 0 0 10px #ffd166, 0 0 20px #06d6a0, 0 0 30px #118ab2;
      opacity: 0;
      animation: pawprintPopBelow 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes pawprintPopBelow {
      0% {
        transform: translate(-50%, -30%) scale(0.3) rotate(0deg);
        opacity: 1;
      }
      50% {
        transform: translate(-50%, 15%) scale(1.2) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, 35%) scale(1) rotate(0deg);
        opacity: 0;
      }
    }

    /* ==========================================
        MUSHROOM CLUSTER STYLES
        ========================================== */
    .mushroom-cluster {
      position: absolute;
      top: 76%;
      left: 76%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: flex-end;
      gap: 3px;
      z-index: 20;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .glowing-mushroom {
      background: transparent;
      border: none;
      padding: 0;
      pointer-events: none;
      position: relative;
      transition: transform 0.2s ease;
    }

    .mushroom-cluster:hover { transform: translate(-50%, -50%) scale(1.15); }

    .mushroom-main { width: 26px; height: 26px; }
    .mushroom-side-1 { width: 20px; height: 20px; margin-bottom: -2px; }
    .mushroom-side-2 { width: 16px; height: 16px; margin-bottom: -4px; }

    .shroom-cap {
      background-color: #e08a47;
      border-radius: 12px 12px 4px 4px;
      position: absolute;
      top: 0; left: 0; right: 0;
      margin: 0 auto;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-cap { width: 24px; height: 15px; }
    .mushroom-side-1 .shroom-cap { width: 18px; height: 12px; }
    .mushroom-side-2 .shroom-cap { width: 15px; height: 10px; }

    .shroom-stem {
      background-color: #f3c68f;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      margin: 0 auto;
      border-radius: 2px;
      transition: all 0.4s ease;
    }

    .mushroom-main .shroom-stem { width: 8px; height: 13px; }
    .mushroom-side-1 .shroom-stem { width: 6px; height: 10px; }
    .mushroom-side-2 .shroom-stem { width: 5px; height: 8px; }

    .glowing-mushroom.mushroom-glowing .shroom-cap {
      background-color: #06d6a0 !important;
      box-shadow: 0 0 14px #06d6a0, 0 0 24px #118ab2;
    }

    .glowing-mushroom.mushroom-glowing .shroom-stem {
      background-color: #a9def9 !important;
      box-shadow: 0 0 10px #06d6a0;
    }

    /* ==========================================
        WALKING EMBER CHARACTER & NERD GLASSES
        ========================================== */
    .ember-wrapper {
      position: absolute;
      width: 120px;
      height: 120px;
      z-index: 18;
      pointer-events: none;
      transform: translate(-50%, -85%);
      will-change: left, top, transform, opacity;
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .ember-char { width: 100%; height: 100%; overflow: visible; }

    .ember-wrapper.is-walking .ember-body-group { animation: continuousWalkAnim 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .ground-shadow { animation: shadowWalkPulse 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-back-left { animation: legMoveBack 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-back-right { animation: legMoveFront 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-front-left { animation: legMoveBack 0.22s infinite alternate ease-in-out; }
    .ember-wrapper.is-walking .leg-front-right { animation: legMoveFront 0.22s infinite alternate ease-in-out; }

    .ember-body-group { transform-origin: 65px 75px; }
    .ground-shadow { transform-origin: 65px 102px; }
    .leg-back-left { transform-origin: 48px 78px; }
    .leg-back-right { transform-origin: 78px 78px; }
    .leg-front-left { transform-origin: 54px 80px; }
    .leg-front-right { transform-origin: 72px 80px; }
    .tail-group { transform-origin: 92px 82px; animation: tailSwishNormal 1.2s infinite ease-in-out; }

    .nerd-glasses-group {
      opacity: 0;
      transform: translateY(-25px) scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      transform-origin: 65px 40px;
    }

    .ember-wrapper.wearing-glasses .nerd-glasses-group {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }

    @keyframes legMoveBack {
      0% { transform: translateY(0px) rotate(-14deg); }
      100% { transform: translateY(-4px) rotate(14deg); }
    }

    @keyframes legMoveFront {
      0% { transform: translateY(-4px) rotate(14deg); }
      100% { transform: translateY(0px) rotate(-14deg); }
    }

    @keyframes continuousWalkAnim {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-5px) rotate(2deg); }
    }

    @keyframes shadowWalkPulse {
      0% { transform: scaleX(1) scaleY(1); opacity: 0.75; }
      100% { transform: scaleX(0.78) scaleY(0.5); opacity: 0.35; }
    }

    @keyframes tailSwishNormal {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }

    /* ==========================================
        MODAL STYLES
        ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 7, 12, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: #0f1c2d;
      border: 1px solid rgba(255, 209, 102, 0.3);
      padding: 2rem;
      border-radius: 16px;
      max-width: 480px;
      width: 90%;
      color: #f1f5f9;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .close-btn {
      position: absolute;
      top: 12px; right: 15px;
      background: none; border: none;
      color: #ffd166; font-size: 1.5rem;
      cursor: pointer;
      z-index: 10;
    }

    .modal-content h3 { color: #ffd166; font-family: 'Georgia', serif; margin-bottom: 0.5rem; }
    .modal-content p { font-size: 0.9rem; color: #b2bec3; margin-bottom: 1.2rem; line-height: 1.5; }

    /* Cabin Interior, Gallery, & Contact Form Styles */
    .feature-modal {
      max-width: 540px;
      background: #111b2b;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .gallery-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255, 209, 102, 0.2);
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .contact-input, .contact-textarea {
      width: 100%;
      padding: 0.7rem;
      background: #0a1019;
      border: 1px solid rgba(255, 209, 102, 0.3);
      border-radius: 6px;
      color: #fffdf0;
      font-family: inherit;
      font-size: 0.9rem;
    }

    .contact-textarea {
      resize: vertical;
      min-height: 90px;
    }

    .contact-submit {
      background: #ffd166;
      color: #111b2b;
      border: none;
      padding: 0.7rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Georgia', serif;
      transition: background 0.2s;
    }

    .contact-submit:hover {
      background: #f3c68f;
    }

    /* First-Person POV Storybook Modal Styling */
    .storybook-modal-content {
      max-width: 680px;
      background: #fdfbf7;
      color: #2c221e;
      border: 3px solid #d4af37;
      padding: 2.5rem 2.5rem 2rem 2.5rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(212, 175, 55, 0.15);
      border-radius: 12px;
      position: relative;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .storybook-modal-content .close-btn {
      color: #7c6530;
      top: 15px;
      right: 20px;
    }

    .storybook-page {
      display: none;
      animation: fadeInPage 0.4s ease-in-out;
      flex-grow: 1;
    }

    .storybook-page.active-page {
      display: block;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .storybook-text {
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      color: #3e2723;
      line-height: 1.8;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(245, 239, 230, 0.6);
      padding: 1.8rem;
      border-radius: 8px;
      border-left: 4px solid #d4af37;
      text-align: left;
      font-style: italic;
    }

    .storybook-nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      border-top: 1px solid rgba(212, 175, 55, 0.3);
      padding-top: 1rem;
    }

    .storybook-btn {
      background: #f4ebd0;
      color: #5c4033;
      border: 1px solid #d4af37;
      padding: 0.5rem 1.2rem;
      border-radius: 6px;
      font-family: 'Georgia', serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .storybook-btn:hover:not(:disabled) {
      background: #d4af37;
      color: #fff;
    }

    .storybook-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 0.85rem;
      color: #8c7853;
      font-family: 'Georgia', serif;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="#" class="nav-logo" data-landmark="cabin">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="5" r="1.8"/>
          <circle cx="8" cy="8" r="1.2"/>
          <circle cx="16" cy="8" r="1.2"/>
          <circle cx="6" cy="11" r="1.1"/>
          <circle cx="18" cy="11" r="1.1"/>
          <path d="M12 9.5 C9.5 9.5 8 11.5 8 13.5 C8 15.5 10 17 12 17 C14 17 16 15.5 16 13.5 C16 11.5 14.5 9.5 12 9.5 Z"/>
          <path d="M12 9.5 L12 30" stroke="#f3c68f" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M12 24 Q7 22 5 19 Q9 20 12 24 Z" fill="#f3c68f"/>
          <path d="M12 22 Q17 20 19 17 Q15 18 12 22 Z" fill="#f3c68f"/>
        </svg>
      </div>
      <div class="nav-logo-text">
        <span>Hey You</span>
        <span>Found Me</span>
      </div>
    </a>
    <ul class="nav-links">
      <li><a href="#" data-landmark="cabin">Meet Ember</a></li>
      <li><a href="#" data-landmark="camera">Gallery</a></li>
      <li><a href="#" data-landmark="table">Adventures</a></li>
      <li><a href="#" data-landmark="mailbox">If I'm Lost</a></li>
    </ul>
    <div class="nav-right">
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Ember is home</span>
      </div>
    </div>
  </header>

  <!-- Main Expanded Stage Container -->
  <div class="main-stage-container">
    <div class="top-intro-wrapper">
      <span class="hero-greeting">Hey... ♡</span>
      <h1>You Found Me</h1>
      <p class="hero-subtext">Explore the circular forest trail map. Click anywhere along the path or landmarks to guide Ember!</p>
    </div>

    <!-- Treasure Map Circular Forest Stage -->
    <div id="worldPanorama" class="world-panorama-container">
      <img src="https://images.unsplash.com/photo-1511497584788-8767611925b5?auto=format&fit=crop&w=1000&q=80" alt="Forest Path" class="world-bg-image" />
      <div class="world-vignette-overlay"></div>

      <!-- Vector Art Map Overlay -->
      <svg class="map-vector-overlay" viewBox="0 0 600 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="300" cy="300" r="165" fill="none" stroke="#231f20" stroke-width="48" opacity="0.45"/>
        <circle cx="300" cy="300" r="165" fill="none" stroke="#d5c3aa" stroke-width="40" stroke-dasharray="12 8" opacity="0.9"/>

        <!-- CABIN LANDMARK -->
        <g transform="translate(300, 110)">
          <ellipse cx="0" cy="42" rx="42" ry="12" fill="#03070c" opacity="0.6"/>
          <rect x="-34" y="10" width="68" height="38" rx="3" fill="#654321" stroke="#3d2812" stroke-width="1.5"/>
          <rect x="-22" y="18" width="12" height="13" rx="1" fill="#ffd166" stroke="#3d2812" stroke-width="1"/>
          <rect x="10" y="18" width="16" height="30" rx="1.5" fill="#150a04" stroke="#100804" stroke-width="1"/>
          <polygon points="0,-12 -44,12 44,12" fill="#2d4a3e" stroke="#1b2e26" stroke-width="1.5"/>
        </g>

        <!-- CAMERA LANDMARK -->
        <g transform="translate(456, 300)">
          <line x1="-10" y1="5" x2="-22" y2="30" stroke="#4a311c" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="-10" y1="5" x2="4" y2="30" stroke="#4a311c" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="-20" y="-6" width="20" height="13" rx="2" fill="#8c7853" stroke="#3d2812" stroke-width="1.2"/>
          <circle cx="-10" cy="0" r="5.5" fill="#222" stroke="#ffd166" stroke-width="1.2"/>
        </g>

        <!-- TABLE LANDMARK -->
        <g transform="translate(300, 470)">
          <ellipse cx="0" cy="15" rx="26" ry="9" fill="#03070c" opacity="0.5"/>
          <ellipse cx="0" cy="8" rx="26" ry="9" fill="#654321" stroke="#3d2812" stroke-width="1.5"/>
          <path d="M -9,7 Q 0,2 9,7 Q 0,12 -9,7 Z" fill="#fffdf0" stroke="#c2b280" stroke-width="1"/>
        </g>

        <!-- MAILBOX LANDMARK -->
        <g transform="translate(144, 300)">
          <rect x="-2" y="4" width="4" height="35" fill="#5a3d28" stroke="#332114" stroke-width="1"/>
          <path d="M -12,-4 L 10,-4 A 9,9 0 0,1 19,5 L 19,10 L -12,10 Z" fill="#2d5a43" stroke="#183627" stroke-width="1.5"/>
        </g>
      </svg>

      <!-- Hotspots -->
      <button class="landmark-hotspot" style="top: 24%; left: 50%;" data-landmark="cabin"></button>
      <button class="landmark-hotspot" style="top: 50%; left: 76%;" data-landmark="camera"></button>
      <button class="landmark-hotspot" style="top: 76%; left: 50%;" data-landmark="table"></button>
      <button class="landmark-hotspot" style="top: 50%; left: 24%;" data-landmark="mailbox"></button>

      <!-- Mushroom Cluster Toggle -->
      <button id="secretMushroomCluster" class="mushroom-cluster">
        <div class="glowing-mushroom mushroom-side-2"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
        <div class="glowing-mushroom mushroom-side-1"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
        <div class="glowing-mushroom mushroom-main"><div class="shroom-cap"></div><div class="shroom-stem"></div></div>
      </button>

      <!-- Walking Ember Character -->
      <div id="emberWalker" class="ember-wrapper" style="left: 50%; top: 78%;">
        <svg class="ember-char" viewBox="0 0 130 130" xmlns="http://www.w3.org/2000/svg">
          <ellipse class="ground-shadow" cx="65" cy="102" rx="22" ry="7" fill="#03070c" opacity="0.6"/>
          <g class="ember-body-group">
            <ellipse cx="65" cy="74" rx="26" ry="19" fill="#7a7a7a"/>
            <path d="M 58,64 Q 65,85 72,64 Q 78,78 65,92 Q 52,78 58,64 Z" fill="#ffffff"/>
            <g id="emberLetterInMouth" style="display: none;" transform="translate(62, 45)">
              <rect x="0" y="0" width="16" height="11" rx="2" fill="#fdf6e2" stroke="#d4af37" stroke-width="1"/>
            </g>
            <g class="head-group">
              <polygon points="46,38 36,14 54,28" fill="#5a5a5a"/>
              <polygon points="84,38 94,14 76,28" fill="#5a5a5a"/>
              <circle cx="65" cy="42" r="21" fill="#7a7a7a"/>
              <ellipse cx="56" cy="40" rx="4.5" ry="3" fill="#ffd166"/>
              <ellipse cx="74" cy="40" rx="4.5" ry="3" fill="#ffd166"/>
              <ellipse cx="56" cy="40" rx="1.5" ry="2.2" fill="#111"/>
              <ellipse cx="74" cy="40" rx="1.5" ry="2.2" fill="#111"/>

              <!-- Nerd Glasses -->
              <g class="nerd-glasses-group">
                <line x1="42" y1="39" x2="51" y2="39" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="79" y1="39" x2="88" y2="39" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="50" y="35" width="12" height="10" rx="2" fill="none" stroke="#d4af37" stroke-width="2"/>
                <rect x="68" y="35" width="12" height="10" rx="2" fill="none" stroke="#d4af37" stroke-width="2"/>
                <path d="M 62,39 L 68,39" stroke="#d4af37" stroke-width="2"/>
              </g>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div id="modalContainer"></div>

  <script>
    const worldPanorama = document.getElementById('worldPanorama');
    const emberWalker = document.getElementById('emberWalker');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const modalContainer = document.getElementById('modalContainer');
    const secretMushroomCluster = document.getElementById('secretMushroomCluster');
    const emberLetterInMouth = document.getElementById('emberLetterInMouth');

    const landmarks = {
      cabin: { x: 50, y: 24 },
      camera: { x: 76, y: 50 },
      table: { x: 50, y: 76 },
      mailbox: { x: 24, y: 50 }
    };

    let isLostMode = false;
    let currentStoryPage = 0;

    function moveEmberTo(targetX, targetY, onComplete) {
      const startX = parseFloat(emberWalker.style.left) || 50;
      const startY = parseFloat(emberWalker.style.top) || 78;
      const dx = targetX - startX;
      const dy = targetY - startY;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 1) {
        if (onComplete) onComplete();
        return;
      }

      emberWalker.style.transform = dx < 0 ? 'translate(-50%, -85%) scaleX(-1)' : 'translate(-50%, -85%) scaleX(1)';
      emberWalker.classList.add('is-walking');

      const duration = Math.min(Math.max(distance * 25, 600), 2000);
      const startTime = performance.now();

      function animateWalk(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

        emberWalker.style.left = `${startX + dx * easeProgress}%`;
        emberWalker.style.top = `${startY + dy * easeProgress}%`;

        if (progress < 1) {
          requestAnimationFrame(animateWalk);
        } else {
          emberWalker.classList.remove('is-walking');
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(animateWalk);
    }

    worldPanorama.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      const rect = worldPanorama.getBoundingClientRect();
      const clickX = ((e.clientX - rect.left) / rect.width) * 100;
      const clickY = ((e.clientY - rect.top) / rect.height) * 100;

      const paw = document.createElement('div');
      paw.className = 'click-pawprint';
      paw.innerHTML = '🐾';
      paw.style.left = `${e.clientX}px`;
      paw.style.top = `${e.clientY}px`;
      document.body.appendChild(paw);
      setTimeout(() => paw.remove(), 800);

      emberWalker.classList.remove('wearing-glasses');
      moveEmberTo(clickX, clickY);
    });

    document.querySelectorAll('[data-landmark]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const key = el.getAttribute('data-landmark');
        goToLandmark(key);
      });
    });

    function goToLandmark(key) {
      const loc = landmarks[key];
      if (!loc) return;

      moveEmberTo(loc.x, loc.y, () => {
        if (key === 'table') {
          emberWalker.classList.add('wearing-glasses');
          setTimeout(() => { openModalFor(key); }, 400);
        } else {
          emberWalker.classList.remove('wearing-glasses');
          openModalFor(key);
        }
      });
    }

    function openModalFor(key) {
      closeModal();
      let htmlContent = '';

      if (key === 'cabin') {
        htmlContent = `
          <div class="modal-overlay" id="activeModalOverlay">
            <div class="modal-content feature-modal" onclick="event.stopPropagation()">
              <button class="close-btn" id="modalCloseBtn">&times;</button>
              <h3>Inside Ember's Cabin</h3>
              <p>Welcome to the warm hearth! A cozy wooden sanctuary filled with soft blankets, gentle lamplight, and the quiet comfort of home where Ember loves to curl up and rest.</p>
            </div>
          </div>
        `;
      } else if (key === 'camera') {
        htmlContent = `
          <div class="modal-overlay" id="activeModalOverlay">
            <div class="modal-content feature-modal" onclick="event.stopPropagation()">
              <button class="close-btn" id="modalCloseBtn">&times;</button>
              <h3>Ember's Photo Gallery</h3>
              <p>Snapshots from along the woodland trails, sunny meadows, and cozy resting spots.</p>
              <div class="gallery-grid">
                <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=400&q=80" alt="Explorer Cat 1" class="gallery-img">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80" alt="Explorer Cat 2" class="gallery-img">
                <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80" alt="Explorer Cat 3" class="gallery-img">
                <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80" alt="Explorer Cat 4" class="gallery-img">
              </div>
            </div>
          </div>
        `;
      } else if (key === 'table') {
        currentStoryPage = 0;
        htmlContent = `
          <div class="modal-overlay" id="activeModalOverlay">
            <div class="modal-content storybook-modal-content" onclick="event.stopPropagation()">
              <button class="close-btn" id="modalCloseBtn">&times;</button>
              
              <div class="storybook-page active-page" data-page="0">
                <div class="storybook-text">
                  Hello, friend. My name is Ember, but the people who love me most call me Mama.
                </div>
              </div>

              <div class="storybook-page" data-page="1">
                <div class="storybook-text">
                  I wasn't always the fearless little explorer you see today. Once upon a time, I was just a tiny kitten with curious eyes and paws that could never stay still. Every rustling leaf, dancing butterfly, and winding trail whispered another adventure waiting to be discovered.
                </div>
              </div>

              <div class="storybook-page" data-page="2">
                <div class="storybook-text">
                  As I grew, I became known for carrying my little traveler stick with a handkerchief tied to the end, convinced that every great explorer needed supplies for the journey ahead. Whether I was marching through moonlit forests, hopping across old stone paths, or inspecting every flower I could find, I believed the world was full of hidden treasures and friendly faces.
                </div>
              </div>

              <div class="storybook-page" data-page="3">
                <div class="storybook-text">
                  But no matter how exciting the adventure became, there was always one place that mattered more than any forest, field, or mountain.<br><br><strong>Home.</strong>
                </div>
              </div>

              <div class="storybook-page" data-page="4">
                <div class="storybook-text">
                  My family loves me more than all the stars in the night sky. They worry when I wander too far because, while I think I'm on the greatest expedition ever, they only see an empty spot where I should be sleeping.
                </div>
              </div>

              <div class="storybook-page" data-page="5">
                <div class="storybook-text">
                  If you've found me, then you've become part of my story. Thank you for stopping, for caring, and for helping a little adventurer find her way back to the people waiting with open arms.
                </div>
              </div>

              <div class="storybook-page" data-page="6">
                <div class="storybook-text">
                  I may be brave enough to chase the horizon, but my favorite destination has always been home.<br><br>Thank you for helping me get there. ❤️
                </div>
              </div>

              <div class="storybook-nav-row">
                <button class="storybook-btn" id="prevPageBtn" disabled>&#10094; Previous</button>
                <span class="page-indicator" id="pageIndicator">Page 1 of 7</span>
                <button class="storybook-btn" id="nextPageBtn">Next &#10095;</button>
              </div>
            </div>
          </div>
        `;
      } else if (key === 'mailbox') {
        htmlContent = `
          <div class="modal-overlay" id="activeModalOverlay">
            <div class="modal-content feature-modal" onclick="event.stopPropagation()">
              <button class="close-btn" id="modalCloseBtn">&times;</button>
              <h3>If I'm Lost</h3>
              <p>Spotted Ember out exploring or want to send a note back along the trail? Drop a message for her family!</p>
              <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent along the trail.'); closeModal();">
                <input type="text" class="contact-input" placeholder="Your Name or Where You Found Her" required />
                <textarea class="contact-textarea" placeholder="Your message..." required></textarea>
                <button type="submit" class="contact-submit">Send Note</button>
              </form>
            </div>
          </div>
        `;
      }

      modalContainer.innerHTML = htmlContent;

      const overlay = document.getElementById('activeModalOverlay');
      const closeBtn = document.getElementById('modalCloseBtn');

      if (overlay && closeBtn) {
        closeBtn.addEventListener('click', () => {
          closeModal();
          emberWalker.classList.remove('wearing-glasses');
        });
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            closeModal();
            emberWalker.classList.remove('wearing-glasses');
          }
        });
      }

      if (key === 'table') {
        const prevBtn = document.getElementById('prevPageBtn');
        const nextBtn = document.getElementById('nextPageBtn');
        if (prevBtn && nextBtn) {
          prevBtn.addEventListener('click', () => changeStoryPage(-1));
          nextBtn.addEventListener('click', () => changeStoryPage(1));
        }
      }
    }

    function closeModal() {
      modalContainer.innerHTML = '';
    }

    function changeStoryPage(direction) {
      const pages = document.querySelectorAll('.storybook-page');
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');
      const indicator = document.getElementById('pageIndicator');
      
      if (!pages.length) return;

      pages[currentStoryPage].classList.remove('active-page');
      currentStoryPage += direction;

      if (currentStoryPage < 0) currentStoryPage = 0;
      if (currentStoryPage >= pages.length) currentStoryPage = pages.length - 1;

      pages[currentStoryPage].classList.add('active-page');
      indicator.textContent = `Page ${currentStoryPage + 1} of ${pages.length}`;
      if (prevBtn) prevBtn.disabled = (currentStoryPage === 0);
      if (nextBtn) nextBtn.disabled = (currentStoryPage === pages.length - 1);
    }

    secretMushroomCluster.addEventListener('click', (e) => {
      e.stopPropagation();
      isLostMode = !isLostMode;

      document.querySelectorAll('.glowing-mushroom').forEach(shroom => {
        shroom.classList.toggle('mushroom-glowing', isLostMode);
      });

      if (isLostMode) {
        statusBadge.classList.add('lost');
        statusText.textContent = "Ember is lost!";
        emberLetterInMouth.style.display = 'block';
      } else {
        statusBadge.classList.remove('lost');
        statusText.textContent = "Ember is home";
        emberLetterInMouth.style.display = 'none';
      }
    });
  </script>
</body>
</html>
