<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember - The Whispering Woods</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="navbar">
    <div class="nav-logo">
      <span>🍂</span> EMBER
    </div>
    <ul class="nav-links">
      <li><a href="#hero" class="active">Forest</a></li>
      <li><a href="#explore">Lore</a></li>
      <li><a href="#kindness">Map</a></li>
    </ul>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero" id="hero">
    <!-- BACKGROUND TREES SVG -->
    <svg class="forest-trees" viewBox="0 0 1200 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.6">
        <path d="M 120 600 L 135 320 L 150 200 L 160 600 Z" fill="#020408"/>
        <circle cx="140" cy="180" r="95" fill="#0a1728"/>
        <path d="M 1020 600 L 1030 350 L 1055 600 Z" fill="#020408"/>
        <circle cx="1035" cy="130" r="120" fill="#0a1728"/>
      </g>
    </svg>

    <!-- MAIN CONTENT COPY -->
    <div class="content">
      <h1>Lost Spirit of the Woods</h1>
      <p>Guiding embers through the twilight canopy. Whispers say he carries the warmth of forgotten fires.</p>
      <div class="hero-buttons">
        <button class="btn-orange" id="interact-btn">Speak to Ember</button>
        <button class="btn-dark" id="report-btn">Signal Location</button>
      </div>
    </div>

    <!-- EMBER STAGE WITH LANTERNS & MUSHROOMS -->
    <div class="ember-stage">
      <div class="speech-bubble" id="speech-bubble">"The stars are bright tonight..."</div>
      
      <div class="character-container">
        <!-- LANTERNS -->
        <div class="glowing-lantern lantern-left">
          <div class="lantern-string"></div>
          <div class="lantern-body"><div class="lantern-glow"></div></div>
        </div>
        <div class="glowing-lantern lantern-right">
          <div class="lantern-string"></div>
          <div class="lantern-body"><div class="lantern-glow"></div></div>
        </div>

        <!-- EMBER CHARACTER -->
        <svg id="ember-character" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="100" cy="135" rx="42" ry="48" fill="#1b2820"/>
          <circle cx="100" cy="80" r="32" fill="#1b2820"/>
          <ellipse cx="88" cy="76" rx="5" ry="7" fill="#7df9ff"/>
          <ellipse cx="112" cy="76" rx="5" ry="7" fill="#7df9ff"/>
        </svg>

        <!-- MUSHROOMS -->
        <div class="glowing-mushroom mushroom-1">
          <div class="shroom-cap"></div>
          <div class="shroom-stem"></div>
        </div>
        <div class="glowing-mushroom mushroom-2">
          <div class="shroom-cap"></div>
          <div class="shroom-stem"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- INTERACTIVE SCRIPT -->
  <script>
    const ember = document.getElementById('ember-character');
    const speech = document.getElementById('speech-bubble');
    const btn = document.getElementById('interact-btn');

    const phrases = [
      '"The stars are bright tonight..."',
      '"Did you bring any sweet berries?"',
      '"Listen closely to the wind in the pines..."'
    ];

    function speak() {
      if (speech) {
        speech.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      }
    }

    if (ember) ember.addEventListener('click', speak);
    if (btn) btn.addEventListener('click', speak);
  </script>
</body>
</html>
