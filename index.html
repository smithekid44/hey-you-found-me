<!-- JavaScript for Fireflies and JSONbin.io Live Sync -->
  <script>
    const firefliesContainer = document.getElementById('fireflies');
    for (let i = 0; i < 28; i++) {
      const firefly = document.createElement('div');
      firefly.classList.add('firefly');
      firefly.style.left = `${Math.random() * 100}%`;
      firefly.style.top = `${Math.random() * 100}%`;
      firefly.style.animationDelay = `${Math.random() * 5}s`;
      firefly.style.animationDuration = `${5 + Math.random() * 5}s`;
      firefliesContainer.appendChild(firefly);
    }

    const BIN_ID = '6a6d10d5f5f4af5e29dbba5a';
    const API_KEY = '$2a$10$n6/bIWyMwykOIHMdHLpUoea.KTSuyJ4R2mHLuvkCNjyy.L6vPUXAq';
    // Base URL for JSONbin
    const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    async function fetchStatus() {
      try {
        // Adding a unique timestamp query parameter prevents browser/CDN caching
        const response = await fetch(`${BIN_URL}?t=${new Date().getTime()}`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await response.json();
        updateUI(data.record.isMissing);
      } catch (error) {
        console.error('Error fetching status:', error);
      }
    }

    function updateUI(isMissing) {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      const wrapper = document.getElementById('emberWrapper');
      const bubble = document.getElementById('speechBubble');

      if (isMissing) {
        badge.classList.add('is-missing');
        text.textContent = 'Ember is Lost';
        wrapper.classList.add('is-lost');
        bubble.style.display = 'block';
      } else {
        badge.classList.remove('is-missing');
        text.textContent = 'Ember is Safe';
        wrapper.classList.remove('is-lost');
        bubble.style.display = 'none';
      }
    }

    async function toggleStatus() {
      try {
        // 1. Fetch current status with cache-busting
        const getRes = await fetch(`${BIN_URL}?t=${new Date().getTime()}`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const getData = await getRes.json();
        const newStatus = !getData.record.isMissing;

        // 2. PUT new status to JSONbin
        const putRes = await fetch(BIN_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({ isMissing: newStatus })
        });

        if (putRes.ok) {
          updateUI(newStatus);
        }
      } catch (error) {
        console.error('Error toggling status:', error);
      }
    }

    document.getElementById('secretTrigger').addEventListener('click', toggleStatus);

    // Initial fetch on load
    fetchStatus();
    
    // Poll every 3 seconds
    setInterval(fetchStatus, 3000);
  </script>
